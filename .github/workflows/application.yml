name: Application checks
on:
  pull_request:
  push:
    branches: [main, 'epic/**', 'task/**']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Build and isolated PostgreSQL tests
        working-directory: backend
        run: ./gradlew --no-daemon --console=plain clean build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build study package for offline browser checks
        run: python3 scripts/build_pages.py --branch main --stored "$RUNNER_TEMP/empty" --output "$RUNNER_TEMP/study"
      - run: npm run test:e2e
        working-directory: frontend
        env:
          STUDY_ROOT: ${{ runner.temp }}/study
  study-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check_links.py
      - name: Build unchanged public material
        run: python3 scripts/build_pages.py --branch main --stored "$RUNNER_TEMP/empty" --output "$RUNNER_TEMP/study"
      - run: python3 scripts/check_links.py --root "$RUNNER_TEMP/study"
