name: Static Pages checks
on:
  pull_request:
  push:
    branches: [main, stable]
permissions:
  contents: read
jobs:
  static-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s scripts/tests -p test_build_pages.py -v
      - run: python3 scripts/check_links.py
