name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch a publicar (main = produção; demais = preview estático)'
        required: true
        default: main
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
      - name: Validate requested branch
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          test "$BRANCH" != pages-store
          git check-ref-format "refs/heads/$BRANCH"
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check internal links
        run: python3 scripts/check_links.py
      - uses: actions/configure-pages@v5
      - name: Read published previews
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads origin pages-store; then
            git fetch origin pages-store
            git worktree add "$RUNNER_TEMP/stored" FETCH_HEAD
          else
            mkdir -p "$RUNNER_TEMP/stored"
          fi
      - name: Read approved production version
        if: (inputs.branch || 'main') != 'main'
        uses: actions/checkout@v4
        with:
          ref: main
          path: approved
      - name: Prepare production and preview
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
        run: python3 scripts/build_pages.py --branch "$BRANCH" --stored "$RUNNER_TEMP/stored" --output "$RUNNER_TEMP/site"
      - name: Save published versions
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init -b pages-store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config http."${GITHUB_SERVER_URL}/".extraheader "$(git -C "$GITHUB_WORKSPACE" config --get http."${GITHUB_SERVER_URL}/".extraheader)"
          if git ls-remote --exit-code --heads origin pages-store; then
            git fetch origin pages-store
            git reset --soft FETCH_HEAD
          fi
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Publish site for $BRANCH"
            git push origin HEAD:pages-store
          fi
          rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
