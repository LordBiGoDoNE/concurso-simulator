name: Spec review gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  spec-review:
    name: ${{ github.base_ref == 'epic/application-reformulation' && 'spec-review' || 'spec-review-tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test review gate
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Require current independent review for spec integration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: >-
          python3 scripts/check_spec_review.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --base-ref "$BASE_REF" --head-ref "$HEAD_REF"
          --title "$PR_TITLE" --pr "$PR_NUMBER"
          --head-repository "$HEAD_REPOSITORY" --base-repository "$BASE_REPOSITORY"
