="362" font-size="18" fill="#2b2b2b" text-anchor="middle" font-weight="700">Nos três (centro): 6</text><text x="240" y="390" font-size="18" fill="#5f6368" text-anchor="middle">As duplas 15, 12 e 10</text><text x="240" y="418" font-size="18" fill="#5f6368" text-anchor="middle">incluem quem fez os três</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0364;0.0636;0.2;0.2273;1" dur="11s" begin="0s" fill="freeze"/></g><g opacity="0"><text x="240" y="362" font-size="18" fill="#2b2b2b" text-anchor="middle">E e W, fora de R: 15 − 6 = 9</text><text x="240" y="390" font-size="18" fill="#2b2b2b" text-anchor="middle">E e R, fora de W: 12 − 6 = 6</text><text x="240" y="418" font-size="18" fill="#2b2b2b" text-anchor="middle">W e R, fora de E: 10 − 6 = 4</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2182;0.2455;0.4727;0.5;1" dur="11s" begin="0s" fill="freeze"/></g><g opacity="0"><text x="240" y="362" font-size="18" fill="#2b2b2b" text-anchor="middle">Somente E: 45 − 9 − 6 − 6 = 24</text><text x="240" y="390" font-size="18" fill="#2b2b2b" text-anchor="middle">Somente W: 38 − 9 − 4 − 6 = 19</text><text x="240" y="418" font-size="18" fill="#2b2b2b" text-anchor="middle">Somente R: 30 − 6 − 4 − 6 = 14</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4909;0.5182;0.7636;0.7909;1" dur="11s" begin="0s" fill="freeze"/></g><g opacity="1"><text x="240" y="362" font-size="18" fill="#2b2b2b" text-anchor="middle" font-weight="700">União: 24 + 19 + 14 + 9 + 6 + 4 + 6 = 82</text><text x="240" y="390" font-size="18" fill="#2b2b2b" text-anchor="middle">Nenhum: 100 − 82 = 18</text><text x="240" y="418" font-size="18" fill="#2b2b2b" text-anchor="middle">Conferência: 82 + 18 = 100</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7818;0.8091;1" dur="11s" begin="0s" fill="freeze"/></g></svg>
