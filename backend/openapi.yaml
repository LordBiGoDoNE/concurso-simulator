        purpose: {type: string, enum: [SIMULADO, PRATICA_AULA]}
        destinationId: {type: string}
        packageDigest: {type: string}
        selectionDigest: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/QuestionImportPreviewItem'}}
        possibleDuplicates: {type: array, items: {type: array, items: {type: string}}}
        confirmable: {type: boolean}
        confirmationToken: {type: [string, 'null']}
        expiresAt: {type: [string, 'null'], format: date-time}
    QuestionImportConfirmation:
      type: object
      additionalProperties: false
      required: [nonce, actor, destination, packageDigest, selectionDigest, issuedAt, expiresAt]
      properties:
        nonce: {type: string, format: uuid}
        actor: {type: string, format: uuid}
        destination: {type: string}
        packageDigest: {type: string}
        selectionDigest: {type: string}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    QuestionImportResult:
      type: object
      additionalProperties: false
      required: [origin, questionId, revisionId, reused]
      properties:
        origin: {$ref: '#/components/schemas/QuestionImportOrigin'}
