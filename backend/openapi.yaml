      type: object
      additionalProperties: false
      required: [questionId, revisionId, fingerprint, eligibleRevisionId, editorialSequence]
      properties:
        questionId: {type: string, format: uuid}
        revisionId: {type: string, format: uuid}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        eligibleRevisionId: {type: [string, 'null'], format: uuid}
        editorialSequence: {type: integer, minimum: 0}
