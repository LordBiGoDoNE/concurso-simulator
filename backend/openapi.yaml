      type: object
      additionalProperties: false
      required: [packageDigest, selectionDigest, keys, package]
      properties:
        packageDigest: {type: string}
        selectionDigest: {type: string}
        keys: {type: array, items: {type: string}}
        package: {$ref: '#/components/schemas/QuestionImportPackage'}
