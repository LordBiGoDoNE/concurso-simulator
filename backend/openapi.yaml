        items:
          type: [array, 'null']
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [questionId, revisionId, fingerprint]
            properties:
              questionId: {type: string, format: uuid}
              revisionId: {type: string, format: uuid}
              fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        importReceiptId: {type: [string, 'null'], format: uuid}
    EditorialBatchPreviewItem:
      type: object
      additionalProperties: false
      required: [questionId, origin, revisionId, fingerprint, currentStatus, resultingStatus, eligibleRevisionId, editorialSequence, refusal]
      properties:
        questionId: {type: string, format: uuid}
        origin: {oneOf: [{$ref: '#/components/schemas/AdminQuestionOrigin'}, {type: 'null'}]}
        revisionId: {type: string, format: uuid}
        fingerprint: {type: [string, 'null']}
        currentStatus: {type: [string, 'null'], enum: [DRAFT, IN_REVIEW, APPROVED, null]}
        resultingStatus: {type: [string, 'null'], enum: [IN_REVIEW, APPROVED, null]}
        eligibleRevisionId: {type: [string, 'null'], format: uuid}
        editorialSequence: {type: [integer, 'null']}
        refusal: {type: [string, 'null'], enum: [QUESTION_NOT_FOUND, REVISION_NOT_FOUND, FINGERPRINT_MISMATCH, INVALID_TRANSITION, CHECKLIST_INCOMPLETE, null]}
    EditorialBatchPreview:
      type: object
      additionalProperties: false
      required: [destinationId, action, reviewKind, checklist, rationale, items, expected, digest, confirmable, confirmationToken, expiresAt]
      properties:
        destinationId: {type: string}
        action: {type: string, enum: [SUBMIT, APPROVE]}
        reviewKind: {$ref: '#/components/schemas/ReviewKind'}
        checklist: {$ref: '#/components/schemas/EditorialBatchChecklist'}
        rationale: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/EditorialBatchPreviewItem'}}
        expected: {type: array, items: {$ref: '#/components/schemas/EditorialBatchExpected'}}
        digest: {type: [string, 'null']}
        confirmable: {type: boolean}
        confirmationToken: {type: [string, 'null']}
        expiresAt: {type: [string, 'null'], format: date-time}
    EditorialBatchApplyRequest:
      type: object
      additionalProperties: false
      required: [action, reviewKind, checklist, rationale, items, confirmationToken]
      properties:
        action: {type: string, enum: [SUBMIT, APPROVE]}
        reviewKind: {$ref: '#/components/schemas/ReviewKind'}
        checklist: {$ref: '#/components/schemas/EditorialBatchChecklist'}
        rationale: {type: string, maxLength: 3500}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/EditorialBatchExpected'}}
        confirmationToken: {type: string, maxLength: 4096}
    EditorialBatchConfirmation:
      type: object
      additionalProperties: false
      required: [nonce, actor, destination, digest, issuedAt, expiresAt]
      properties:
        nonce: {type: string, format: uuid}
        actor: {type: string, format: uuid}
        destination: {type: string}
        digest: {type: string}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    EditorialBatchReceipt:
      type: object
      additionalProperties: false
      required: [confirmation, committedAt, action, reviewKind, responsible, decisions]
      properties:
        confirmation: {$ref: '#/components/schemas/EditorialBatchConfirmation'}
        committedAt: {type: string, format: date-time}
        action: {type: string, enum: [SUBMIT, APPROVE]}
        reviewKind: {$ref: '#/components/schemas/ReviewKind'}
        responsible: {type: string}
        decisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [questionId, revisionId, fingerprint, decisionSequence, resultingStatus]
            properties:
