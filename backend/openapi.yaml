      type: object
      additionalProperties: false
      description: Exatamente um dos campos
      properties:
        questionIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
        importReceiptId: {type: string, format: uuid}
