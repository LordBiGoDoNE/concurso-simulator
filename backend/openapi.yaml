        minimumBases: {type: integer, const: 3}
        window: {$ref: '#/components/schemas/SubjectReviewWindow'}
        subjects: {type: array, minItems: 51, maxItems: 51, items: {$ref: '#/components/schemas/SubjectReviewSubject'}}
        priorityTopicIds: {type: array, uniqueItems: true, maxItems: 51, items: {type: string}}
    SubjectReviewIndividual:
      type: object
      additionalProperties: false
      required: [policy, roleId, minimumBases, attemptId, subjects, priorityTopicIds]
      properties:
        policy: {type: string, const: subject-review/v1}
        roleId: {type: string, enum: [assistente-administrativo, secretario-de-escola]}
        minimumBases: {type: integer, const: 3}
        attemptId: {type: string, format: uuid}
        subjects: {type: array, minItems: 51, maxItems: 51, items: {$ref: '#/components/schemas/SubjectReviewSubject'}}
        priorityTopicIds: {type: array, uniqueItems: true, maxItems: 51, items: {type: string}}
    QuestionImportAccessError:
      type: object
      additionalProperties: false
      required: [error]
      properties: {error: {type: string}}
    QuestionImportError:
      type: object
      additionalProperties: false
      required: [error, correlationId]
      properties: {error: {type: string}, correlationId: {type: string, format: uuid}}
    QuestionImportOrigin:
      type: object
      additionalProperties: false
      required: [namespace, key]
      properties:
        namespace: {type: string, enum: [admin-question-v1, lesson-practice-v1]}
        key: {type: string, maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
    QuestionImportProvenance:
      type: object
      additionalProperties: false
      required: [author, contentPath, answerPath, contentSha256, answerSha256]
      properties:
        author: {type: string, maxLength: 500}
        contentPath: {type: string, pattern: '^sources/'}
        answerPath: {type: string, pattern: '^sources/'}
        contentSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        answerSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    QuestionImportReference:
      type: object
      additionalProperties: false
      required: [name, url, legalBasis]
      properties:
        name: {type: string, maxLength: 1000}
        url: {type: string, format: uri, maxLength: 4000}
        legalBasis:
          type: [object, 'null']
          additionalProperties: false
          required: [provision, checkedOn]
          properties: {provision: {type: string, maxLength: 4000}, checkedOn: {type: string, format: date}}
    QuestionImportContent:
      type: object
      additionalProperties: false
      required: [statement, alternatives, correctAlternativeId, resolution, classification, references, provenance]
      properties:
        statement: {$ref: '#/components/schemas/QuestionText'}
        alternatives: {type: array, minItems: 2, maxItems: 10, items: {$ref: '#/components/schemas/QuestionAlternative'}}
        correctAlternativeId: {type: string, format: uuid}
        resolution: {$ref: '#/components/schemas/QuestionText'}
        classification: {$ref: '#/components/schemas/QuestionClassification'}
        references: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/QuestionImportReference'}}
        provenance: {$ref: '#/components/schemas/QuestionImportProvenance'}
    QuestionImportItem:
      type: object
      additionalProperties: false
      required: [origin, content, fingerprint, expectedLatestRevision]
      properties:
        origin: {$ref: '#/components/schemas/QuestionImportOrigin'}
        content: {$ref: '#/components/schemas/QuestionImportContent'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        expectedLatestRevision: {type: [string, 'null'], format: uuid}
    QuestionImportFile:
      type: object
      additionalProperties: false
      required: [path, mediaType, sha256, base64]
      properties:
        path: {type: string, maxLength: 1000}
        mediaType: {type: string, enum: [text/plain, application/json, image/png, image/jpeg, image/svg+xml]}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        base64: {type: string, maxLength: 1398104, contentEncoding: base64}
    QuestionImportPackage:
      type: object
      additionalProperties: false
      required: [format, purpose, items, files]
      properties:
        format: {type: string, const: administrative-question-package/v1}
        purpose: {type: string, enum: [SIMULADO, PRATICA_AULA]}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/QuestionImportItem'}}
        files: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/QuestionImportFile'}}
      description: >-
        Uma finalidade por pacote. SIMULADO exige admin-question-v1; PRATICA_AULA exige
        lesson-practice-v1 e chaves admin.*. Todos os arquivos referenciados, até 8 MiB
        decodificados somados. Fontes não são publicadas. Finalidade participa do digest.
    QuestionImportPreviewRequest:
      type: object
      additionalProperties: false
      required: [package, keys]
      properties:
        package: {$ref: '#/components/schemas/QuestionImportPackage'}
        keys: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
    QuestionImportApplyRequest:
      type: object
      additionalProperties: false
      required: [package, keys, confirmationToken]
      properties:
        package: {$ref: '#/components/schemas/QuestionImportPackage'}
        keys: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
        confirmationToken: {type: string, maxLength: 4096}
    QuestionImportPreviewItem:
      type: object
