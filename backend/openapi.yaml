      type: object
      additionalProperties: false
      required: [destinationId, receipt, replayed]
      properties:
        destinationId: {type: string}
        receipt: {$ref: '#/components/schemas/EditorialBatchReceipt'}
        replayed: {type: boolean}
    EditorialBatchConflict:
      type: object
      additionalProperties: false
      required: [error, questionIds, correlationId]
      properties:
        error: {type: string, enum: [CONFIRMATION_MISMATCH, CONFIRMATION_EXPIRED, BATCH_DIVERGED]}
        questionIds: {type: [array, 'null'], description: Somente em BATCH_DIVERGED, items: {type: string, format: uuid}}
        correlationId: {type: string, format: uuid}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
