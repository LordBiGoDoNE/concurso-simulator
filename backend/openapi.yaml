openapi: 3.1.0
info:
  title: Concurso Simulator — API de plataforma
  version: 0.1.0
  description: Contrato inicial público, sem dados de usuários ou gabaritos.
paths:
  /api/v1/status:
    get:
      summary: Verificar disponibilidade da aplicação e do banco
      operationId: getStatus
      responses:
        '200':
          description: Aplicação e banco disponíveis
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: UP
        '503':
          description: Banco indisponível após a inicialização
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: DOWN
  /api/v1/me:
    get:
      summary: Consultar a própria identidade (sessão necessária)
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Identidade atual; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '401':
          description: Visitante ou sessão expirada; sem redirect
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: {type: string, const: unauthenticated}
  /api/v1/csrf:
    get:
      summary: Obter token CSRF da sessão; Cache-Control no-store
      responses:
        '200':
          description: Token, também disponível a visitantes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, headerName]
                properties:
                  token: {type: string}
                  headerName: {type: string}
  /api/v1/auth/logout:
    post:
      summary: Encerrar a sessão atual sem desconectar outros dispositivos
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema: {type: string}
      responses:
        '204': {description: Sessão encerrada; também válido para visitante com CSRF}
        '403': {description: Token CSRF ausente ou inválido}
  /api/v1/auth/config:
    get:
      summary: Consultar disponibilidade do login Google, sem segredos
      responses:
        '200':
          description: Login Google habilitado ou desativado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [googleEnabled]
                properties:
                  googleEnabled: {type: boolean}
  /api/v1/question-bank/catalog:
    get:
      summary: Consultar catálogo público fixo de Limeira 01/2026, sem sessão
      security: []
      responses:
        '200':
          description: Catálogo; Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionCatalog'}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
  /api/v1/question-bank/questions:
    get:
      summary: Listar revisões correntes elegíveis; filtros AND, ordem fixa por UUID
      security: []
      parameters:
        - {in: query, name: disciplineId, schema: {type: string, enum: [portugues, matematica-raciocinio, informatica, conhecimentos-administrativos, conhecimentos-escolares]}}
        - {in: query, name: topicId, schema: {type: string, pattern: '^[PMIAS][0-9]{2}$'}}
        - {in: query, name: roleId, schema: {type: string, enum: [assistente-administrativo, secretario-de-escola]}}
        - {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Página, inclusive vazia; sem alternativas/respostas/resoluções; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionPage'}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/question-bank/questions/{questionId}:
    get:
      summary: Ler somente revisão elegível atual; sem acesso a rascunhos/versões antigas
      security: []
      parameters:
        - {in: path, name: questionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Texto acessível/opções/fontes; sem dados corretivos ou caminhos de gabarito; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionDetail'}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '404':
          description: ID desconhecido ou não elegível, indistinguíveis
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties: {error: {type: string, const: not_found}}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/attempts:
    post:
      summary: Compor tentativa do visitante ou conta; 1–100 questões, sem distribuição oficial
      security: [{}, {sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttemptCreate'}
      responses:
        '201': {description: Criada; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptView'}}}}
        '200': {description: Replay confirmado; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptView'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '409': {description: Payload divergente ou acervo insuficiente; error e available por disciplina, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AttemptError'}, {$ref: '#/components/schemas/AttemptInsufficient'}]}}}}
        '500': {description: Falha interna de integridade; sem captura parcial ou dados privados; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptError'}}}}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/attempts/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consultar snapshot e respostas próprias, sem correção ou nota parcial
      responses:
        '200': {description: Tentativa do dono; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptView'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/attempts/{id}/answers/{item}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: item, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Salvar ou limpar resposta por ID; versão esperada e comando idempotente
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttemptAnswer'}
      responses:
        '200': {description: Resposta confirmada ou replay; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptView'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/attempts/{id}/finish:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Concluir irreversivelmente e corrigir snapshot privado; replay confirmado
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttemptFinish'}
      responses:
        '200': {description: Resultado do snapshot concluído; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptFinished'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/attempts/{id}/result:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consultar resultado fechado somente do dono
      responses:
        '200': {description: Resultado do snapshot concluído; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptResult'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/me/attempts:
    get:
      summary: Histórico privado da conta; createdAt/id DESC, sem nota parcial
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: finished, schema: {type: boolean}}
      responses:
        '200': {description: Página do owner, no-store; sem total prometido, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptHistory'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/lesson-practices:
    post:
      summary: Iniciar prática de até cinco questões próprias da aula, sem cargo; correção ao encerrar
      security: [{}, {sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LessonPracticeCreate'}
      responses:
        '201': {description: Criada; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/LessonPracticeView'}}}}
        '200': {description: Replay confirmado; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/LessonPracticeView'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '409': {description: Payload divergente ou acervo insuficiente; error e available por disciplina, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AttemptError'}, {$ref: '#/components/schemas/AttemptInsufficient'}]}}}}
        '500': {description: Falha interna de integridade; sem captura parcial ou dados privados; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptError'}}}}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/lesson-practices/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consultar snapshot e respostas próprias, sem correção ou nota parcial
      responses:
        '200': {description: Tentativa do dono; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/LessonPracticeView'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/lesson-practices/{id}/answers/{item}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: item, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Salvar ou limpar resposta por ID; versão esperada e comando idempotente
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttemptAnswer'}
      responses:
        '200': {description: Resposta confirmada ou replay; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/LessonPracticeView'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/lesson-practices/{id}/finish:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Concluir irreversivelmente e corrigir snapshot privado; replay confirmado
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttemptFinish'}
      responses:
        '200': {description: Resultado do snapshot concluído; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/LessonPracticeFinished'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/lesson-practices/{id}/result:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Consultar resultado fechado somente do dono
      responses:
        '200': {description: Resultado do snapshot concluído; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptResult'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/me/lesson-practices:
    get:
      summary: Histórico privado exclusivo de práticas; filtro de modalidade antes da paginação
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: finished, schema: {type: boolean}}
      responses:
        '200': {description: Página do owner, no-store; sem total prometido, content: {application/json: {schema: {$ref: '#/components/schemas/LessonPracticeHistory'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/lesson-practices/availability:
    get:
      summary: Quantidade aprovada exclusiva de prática por assunto, sem cargo
      parameters:
        - {in: query, name: topicId, required: true, schema: {type: string}}
      responses:
        '200': {description: Acervo próprio; maximum cinco; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/LessonPracticeAvailability'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/me/subject-review:
    get:
      summary: Revisão privada dos 51 assuntos, conta e cargo selecionado
      description: Filtros antes de 100 conclusões; finishedAt/UUID DESC, última base antes do agrupamento. Entrada fechada, somente roleId único obrigatório. no-store; não grava progresso.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: roleId, required: true, schema: {type: string, enum: [assistente-administrativo, secretario-de-escola]}}
      responses:
        '200': {description: Janela consistente, métricas e prioridade; owner/capturas nunca serializados, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectReviewOverview'}}}}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '500': {$ref: '#/components/responses/ReviewIntegrity'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/attempts/{id}/subject-review:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Revisão por assunto de tentativa própria concluída, visitante ou conta
      description: Entrada fechada, nenhum query parameter aceito. Não consulta histórico implicitamente; no-store.
      responses:
        '200': {description: Somente contexto e métricas da tentativa solicitada, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectReviewIndividual'}}}}
        '404': {$ref: '#/components/responses/AttemptNotFound'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '400': {$ref: '#/components/responses/QuestionInvalid'}
        '401': {$ref: '#/components/responses/AttemptUnauthenticated'}
        '403': {$ref: '#/components/responses/AttemptForbidden'}
        '500': {$ref: '#/components/responses/ReviewIntegrity'}
        '503': {$ref: '#/components/responses/QuestionUnavailable'}
  /api/v1/admin/question-imports/preview:
    post:
      summary: Conferir pacote administrativo sem persistir rascunhos ou arquivos
      operationId: previewAdministrativeQuestions
      security: [{sessionCookie: []}]
      description: >-
        Sessão ADM por senha ou Google vinculado, permissão persistente/versão vigente, troca inicial concluída e CSRF obrigatório. JSON UTF-8 até
        16 MiB, sem compressão. Até 100 itens por pacote, sem limite cumulativo de acervo.
        Confirmação válida por 15 minutos; respostas no-store. Uma execução por instância.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuestionImportPreviewRequest'}
      responses:
        '200':
          description: Prévia sem escrita; STALE informa confirmable=false e token null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionImportPreview'}
        '400': {$ref: '#/components/responses/QuestionImportError'}
        '401': {$ref: '#/components/responses/QuestionImportAccessError'}
        '403': {$ref: '#/components/responses/QuestionImportAccessError'}
        '413': {$ref: '#/components/responses/QuestionImportEitherError'}
        '415': {$ref: '#/components/responses/QuestionImportEitherError'}
        '422': {$ref: '#/components/responses/QuestionImportError'}
        '429': {$ref: '#/components/responses/QuestionImportAccessError'}
        '500': {$ref: '#/components/responses/QuestionImportError'}
        '503': {$ref: '#/components/responses/QuestionImportError'}
  /api/v1/admin/question-imports/apply:
    post:
      summary: Aplicar seleção confirmada como rascunhos com recibo atômico
      operationId: applyAdministrativeQuestions
      security: [{sessionCookie: []}]
      description: >-
        Mesmos limites e segurança da prévia. Finalidade e origem são imutáveis.
        Grava questões, evidência privada e recibo no mesmo commit; não aprova ou publica.
        Retry da confirmação válida retorna recibo original. No-store, sem payload corretivo.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuestionImportApplyRequest'}
      responses:
        '200':
          description: Commit confirmado ou recibo original em replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionImportApplied'}
        '400': {$ref: '#/components/responses/QuestionImportError'}
        '401': {$ref: '#/components/responses/QuestionImportAccessError'}
        '403': {$ref: '#/components/responses/QuestionImportAccessError'}
        '409': {$ref: '#/components/responses/QuestionImportError'}
        '413': {$ref: '#/components/responses/QuestionImportEitherError'}
        '415': {$ref: '#/components/responses/QuestionImportEitherError'}
        '422': {$ref: '#/components/responses/QuestionImportError'}
        '429': {$ref: '#/components/responses/QuestionImportAccessError'}
        '500': {$ref: '#/components/responses/QuestionImportError'}
        '503': {$ref: '#/components/responses/QuestionImportError'}
  /api/v1/admin/questions:
    get:
      summary: Buscar o acervo administrativo, inclusive rascunhos e origem da revisão
      operationId: searchAdministrativeQuestions
      security: [{sessionCookie: []}]
      description: >-
        Somente leitura (#177). Sessão ADM com permissão persistente/versão vigente e troca inicial concluída.
        Filtros combinados por AND; ausentes não filtram. Atividade = última decisão ou importação registrada.
        Ordem por namespace, chave e ID. Respostas no-store. Não altera rotas públicas de questões.
      parameters:
        - {in: query, name: purpose, schema: {type: string, enum: [SIMULADO, PRATICA_AULA]}}
        - {in: query, name: namespace, schema: {type: string, maxLength: 100}}
        - {in: query, name: keyPrefix, schema: {type: string, minLength: 1, maxLength: 200}}
        - {in: query, name: disciplineId, schema: {type: string}}
        - {in: query, name: topicId, schema: {type: string}}
        - {in: query, name: latestStatus, schema: {type: string, enum: [DRAFT, IN_REVIEW, APPROVED]}}
        - {in: query, name: hasEligible, schema: {type: boolean}}
        - {in: query, name: reviewKind, description: Origem da revisão da aprovação elegível; históricos sem o dado não entram, schema: {type: string, enum: [HUMAN_PEER, AI_ONLY]}}
        - {in: query, name: activityFrom, schema: {type: string, format: date-time}}
        - {in: query, name: activityTo, schema: {type: string, format: date-time}}
        - {in: query, name: page, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Página do acervo, content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuestionPage'}}}}
        '400': {$ref: '#/components/responses/AdminCurationError'}
        '401': {$ref: '#/components/responses/QuestionImportAccessError'}
        '403': {$ref: '#/components/responses/QuestionImportAccessError'}
        '500': {$ref: '#/components/responses/AdminCurationError'}
        '503': {$ref: '#/components/responses/AdminCurationError'}
  /api/v1/admin/questions/{questionId}:
    get:
      summary: Detalhar questão com todas as revisões, gabarito, resolução, decisões e importações
      operationId: getAdministrativeQuestion
      security: [{sessionCookie: []}]
      description: Somente leitura e no-store. Conteúdo no formato aberto do pacote de importação.
      parameters:
        - {in: path, name: questionId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Questão completa, content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuestionDetail'}}}}
        '401': {$ref: '#/components/responses/QuestionImportAccessError'}
        '403': {$ref: '#/components/responses/QuestionImportAccessError'}
        '404': {$ref: '#/components/responses/AdminCurationError'}
        '500': {$ref: '#/components/responses/AdminCurationError'}
        '503': {$ref: '#/components/responses/AdminCurationError'}
  /api/v1/admin/questions/lookup:
    post:
      summary: Conferir origens e fingerprints de um pacote local contra o acervo, sem efeitos
      operationId: lookupAdministrativeQuestions
      security: [{sessionCookie: []}]
      description: >-
        POST somente pelo tamanho do corpo (até 1.000 pares, 2 MiB); não grava nem reserva identidades.
        CSRF obrigatório. Fingerprint nulo devolve PRESENT/ABSENT.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuestionLookupRequest'}}}
      responses:
        '200': {description: Um resultado por par, na ordem enviada, content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuestionLookup'}}}}
        '400': {$ref: '#/components/responses/AdminCurationError'}
        '401': {$ref: '#/components/responses/QuestionImportAccessError'}
        '403': {$ref: '#/components/responses/QuestionImportAccessError'}
        '413': {$ref: '#/components/responses/QuestionImportEitherError'}
        '415': {$ref: '#/components/responses/QuestionImportEitherError'}
        '500': {$ref: '#/components/responses/AdminCurationError'}
        '503': {$ref: '#/components/responses/AdminCurationError'}
  /api/v1/admin/questions/export:
    post:
      summary: Exportar seleção no formato administrative-question-package/v1 reimportável
      operationId: exportAdministrativeQuestions
      security: [{sessionCookie: []}]
      description: >-
        Seleção por questionIds (última revisão de cada, até 100) ou importReceiptId (revisões do recibo), nunca ambos.
        Uma finalidade por pacote; origem administrativa e evidência armazenada obrigatórias. O pacote é conferido
        pelo próprio leitor de importação antes da resposta. Sem efeitos; CSRF obrigatório; no-store.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuestionExportRequest'}}}
      responses:
        '200': {description: Pacote reimportável e digests, content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuestionExport'}}}}
        '400': {$ref: '#/components/responses/AdminCurationError'}
        '401': {$ref: '#/components/responses/QuestionImportAccessError'}
        '403': {$ref: '#/components/responses/QuestionImportAccessError'}
        '413': {$ref: '#/components/responses/QuestionImportEitherError'}
        '415': {$ref: '#/components/responses/QuestionImportEitherError'}
        '422': {description: Exportação recusada sem conteúdo privado, content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuestionExportError'}}}}
        '500': {$ref: '#/components/responses/AdminCurationError'}
        '503': {$ref: '#/components/responses/AdminCurationError'}
  /api/v1/admin/editorial-decisions/preview:
    post:
      summary: Prévia sem escrita de decisões SUBMIT/APPROVE em lote
      operationId: previewEditorialDecisionBatch
      security: [{sessionCookie: []}]
      description: >-
        #177. Sessão ADM com permissão persistente/versão vigente, troca inicial concluída e CSRF. Até 100 questões
        (lista explícita ou recibo de importação, nunca ambos). APPROVE exige reviewKind. Recusas por item vêm das
        regras do domínio; token somente quando todos os itens são válidos, por 15 minutos. No-store.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EditorialBatchPreviewRequest'}}}
      responses:
        '200': {description: Prévia sem efeitos, content: {application/json: {schema: {$ref: '#/components/schemas/EditorialBatchPreview'}}}}
        '400': {$ref: '#/components/responses/AdminCurationError'}
        '401': {$ref: '#/components/responses/QuestionImportAccessError'}
        '403': {$ref: '#/components/responses/QuestionImportAccessError'}
        '413': {$ref: '#/components/responses/QuestionImportEitherError'}
        '415': {$ref: '#/components/responses/QuestionImportEitherError'}
        '500': {$ref: '#/components/responses/AdminCurationError'}
        '503': {$ref: '#/components/responses/QuestionImportEitherError'}
  /api/v1/admin/editorial-decisions/apply:
    post:
      summary: Aplicar tudo-ou-nada o estado confirmado na prévia, com recibo idempotente
      operationId: applyEditorialDecisionBatch
      security: [{sessionCookie: []}]
      description: >-
        Mesmo envelope da prévia, items = expected da prévia e o token. Qualquer divergência entre o estado confirmado e o
        atual recusa o lote inteiro (409 BATCH_DIVERGED). Decisões e recibo no mesmo commit; replay do mesmo token devolve
        o recibo original. Não publica recursos. No-store.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EditorialBatchApplyRequest'}}}
      responses:
        '200': {description: Commit confirmado ou recibo original em replay, content: {application/json: {schema: {$ref: '#/components/schemas/EditorialBatchApplied'}}}}
        '400': {$ref: '#/components/responses/AdminCurationError'}
        '401': {$ref: '#/components/responses/QuestionImportAccessError'}
        '403': {$ref: '#/components/responses/QuestionImportAccessError'}
        '409':
          description: CONFIRMATION_MISMATCH, CONFIRMATION_EXPIRED ou BATCH_DIVERGED (com questionIds); sem efeitos
          content: {application/json: {schema: {$ref: '#/components/schemas/EditorialBatchConflict'}}}
        '413': {$ref: '#/components/responses/QuestionImportEitherError'}
        '415': {$ref: '#/components/responses/QuestionImportEitherError'}
        '500': {$ref: '#/components/responses/AdminCurationError'}
        '503': {$ref: '#/components/responses/QuestionImportEitherError'}
  /api/v1/admin/auth/login:
    post:
      operationId: loginAdministrativeAccount
      summary: Entrar com a credencial local do ADM
      description: >-
        JSON UTF-8 estrito de até 8 KiB; exige CSRF da mesma sessão visitante ou autenticada.
        Rotaciona sessão e CSRF. Nome/senha inválidos têm erro genérico; cinco falhas
        em quinze minutos bloqueiam por quinze minutos, com limite técnico por origem.
        A senha temporária só permite consultar a identidade/conta, trocar senha e sair.
        Cache-Control no-store. Não há cadastro público.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministrativeLoginRequest'}
      responses:
        '204': {description: Login confirmado; buscar novo CSRF e reconsultar /me e conta}
        '400': {$ref: '#/components/responses/AdministrativeError'}
        '401': {$ref: '#/components/responses/AdministrativeError'}
        '403': {$ref: '#/components/responses/AdministrativeError'}
        '413': {$ref: '#/components/responses/AdministrativeError'}
        '415': {$ref: '#/components/responses/AdministrativeError'}
        '429': {$ref: '#/components/responses/AdministrativeError'}
        '500': {$ref: '#/components/responses/AdministrativeError'}
        '503': {$ref: '#/components/responses/AdministrativeError'}
  /api/v1/admin/account:
    get:
      operationId: getAdministrativeAccount
      summary: Consultar estado administrativo privado
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Conta e capacidades atuais, sem hash, UUID de configuração ou segredos; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdministrativeAccount'}
        '401': {$ref: '#/components/responses/AdministrativeError'}
        '403': {$ref: '#/components/responses/AdministrativeError'}
        '500': {$ref: '#/components/responses/AdministrativeError'}
        '503': {$ref: '#/components/responses/AdministrativeError'}
  /api/v1/admin/account/password:
    post:
      operationId: changeAdministrativePassword
      summary: Trocar a senha atual e invalidar acessos administrativos anteriores
      description: >-
        Verifica senha atual, exige nova senha diferente de 15 a 128 caracteres,
        rotaciona sessão/CSRF e versão persistente. Preserva Google e histórico.
        Erro de senha participa da proteção de tentativas. JSON estrito de até 8 KiB, no-store.
      security: [{sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministrativePasswordRequest'}
      responses:
        '204': {description: Troca confirmada; buscar novo CSRF e reconsultar identidade/conta}
        '400': {$ref: '#/components/responses/AdministrativeError'}
        '401': {$ref: '#/components/responses/AdministrativeError'}
        '403': {$ref: '#/components/responses/AdministrativeError'}
        '409': {$ref: '#/components/responses/AdministrativeError'}
        '413': {$ref: '#/components/responses/AdministrativeError'}
        '415': {$ref: '#/components/responses/AdministrativeError'}
        '429': {$ref: '#/components/responses/AdministrativeError'}
        '500': {$ref: '#/components/responses/AdministrativeError'}
        '503': {$ref: '#/components/responses/AdministrativeError'}
  /api/v1/admin/account/google-link:
    post:
      operationId: beginAdministrativeGoogleLink
      summary: Comprovar a senha atual e iniciar intenção de vínculo Google
      description: >-
        Somente ADM sem troca pendente; Google deve estar habilitado. Intenção privada
        de cinco minutos ligada à sessão, state OIDC e versão. O callback existente
        realiza o vínculo após validar Google; conta existente mantém UUID/histórico.
        Histórico local impede transferir ADM para outra conta. Retorno fixo, sem UUID alvo
        ou returnTo do cliente. JSON estrito de até 8 KiB, no-store.
      security: [{sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministrativeGoogleLinkRequest'}
      responses:
        '200':
          description: Navegar ao início OIDC fixo; callback retorna ao frontend configurado com resultado sanitizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdministrativeGoogleLink'}
        '400': {$ref: '#/components/responses/AdministrativeError'}
        '401': {$ref: '#/components/responses/AdministrativeError'}
        '403': {$ref: '#/components/responses/AdministrativeError'}
        '409': {$ref: '#/components/responses/AdministrativeError'}
        '413': {$ref: '#/components/responses/AdministrativeError'}
        '415': {$ref: '#/components/responses/AdministrativeError'}
        '429': {$ref: '#/components/responses/AdministrativeError'}
        '500': {$ref: '#/components/responses/AdministrativeError'}
        '503': {$ref: '#/components/responses/AdministrativeError'}
components:
  responses:
    AdministrativeError:
      description: Erro administrativo sanitizado, no-store; 429 inclui Retry-After de 900 segundos
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdministrativeError'}
    QuestionImportError:
      description: Erro administrativo sanitizado, no-store; código fixo e correlação, sem detalhes privados
      content:
        application/json:
          schema: {$ref: '#/components/schemas/QuestionImportError'}
    QuestionImportAccessError:
      description: Rejeição de segurança/capacidade, no-store; 429 inclui Retry-After
      content:
        application/json:
          schema: {$ref: '#/components/schemas/QuestionImportAccessError'}
    AdminCurationError:
      description: Erro sanitizado da curadoria administrativa, no-store; código fixo e correlação, sem conteúdo privado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/QuestionImportError'}
    QuestionImportEitherError:
      description: Rejeição na entrada ou adaptador, no-store
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/QuestionImportError'}
              - {$ref: '#/components/schemas/QuestionImportAccessError'}
    ReviewIntegrity:
      description: Evidência inconsistente; erro integral e genérico, sem resumo parcial; no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties: {error: {type: string, const: internal_error}}
    QuestionInvalid:
      description: UUID/filtro/paginação/parâmetro desconhecido, vazio ou repetido; no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties: {error: {type: string, const: invalid_request}}
    QuestionUnavailable:
      description: Indisponibilidade/conteúdo incompatível; não é acervo vazio; no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties: {error: {type: string, const: unavailable}}
    AttemptUnauthenticated:
      description: Contexto inválido ou histórico sem conta; no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties: {error: {type: string, const: unauthenticated}}
    AttemptForbidden:
      description: CSRF inválido ou acesso técnico negado; no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties: {error: {type: string, const: forbidden}}
    AttemptNotFound:
      description: Ausente, outro dono ou visitante expirado, indistinguíveis; no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties: {error: {type: string, const: not_found}}
    AttemptConflict:
      description: Estado, versão ou payload divergente; no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties: {error: {type: string, const: conflict}}
  schemas:
    AdministrativeLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, maxLength: 128}
        password: {type: string, maxLength: 128, writeOnly: true}
    AdministrativePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, maxLength: 128, writeOnly: true}
        newPassword: {type: string, minLength: 15, maxLength: 128, writeOnly: true}
    AdministrativeGoogleLinkRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword: {type: string, maxLength: 128, writeOnly: true}
    AdministrativeGoogleLink:
      type: object
      additionalProperties: false
      required: [authorizationUrl]
      properties:
        authorizationUrl: {type: string, const: /oauth2/authorization/google}
    AdministrativeAccount:
      type: object
      additionalProperties: false
      required: [username, mustChangePassword, googleEnabled, googleLinked, questionImportAvailable]
      properties:
        username: {type: string, maxLength: 64}
        mustChangePassword: {type: boolean}
        googleEnabled: {type: boolean}
        googleLinked: {type: boolean}
        questionImportAvailable: {type: boolean}
    AdministrativeError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string}
        correlationId: {type: string, format: uuid}
    QuestionNamed:
      type: object
      additionalProperties: false
      required: [id, title]
      properties: {id: {type: string}, title: {type: string}}
    QuestionTopic:
      type: object
      additionalProperties: false
      required: [id, disciplineId, title]
      properties: {id: {type: string}, disciplineId: {type: string}, title: {type: string}}
    QuestionCatalog:
      type: object
      additionalProperties: false
      required: [contestId, disciplines, topics, roles]
      properties:
        contestId: {type: string, const: limeira-01-2026}
        disciplines: {type: array, items: {$ref: '#/components/schemas/QuestionNamed'}}
        topics: {type: array, items: {$ref: '#/components/schemas/QuestionTopic'}}
        roles: {type: array, items: {$ref: '#/components/schemas/QuestionNamed'}}
    QuestionClassification:
      type: object
      additionalProperties: false
      required: [disciplineId, topicId, roleIds]
      properties:
        disciplineId: {type: string}
        topicId: {type: string}
        roleIds: {type: array, uniqueItems: true, items: {type: string}}
    QuestionResource:
      type: object
      additionalProperties: false
      required: [path, mediaType, sha256, description]
      properties:
        path: {type: string, pattern: '^assets/'}
        mediaType: {type: string, enum: [image/png, image/jpeg, image/svg+xml]}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        description: {type: string}
    QuestionText:
      type: object
      additionalProperties: false
      required: [text, resources]
      properties:
        text: {type: string}
        resources: {type: array, items: {$ref: '#/components/schemas/QuestionResource'}}
    QuestionSummary:
      type: object
      additionalProperties: false
      required: [questionId, revisionId, classification, statementStart]
      properties:
        questionId: {type: string, format: uuid}
        revisionId: {type: string, format: uuid}
        classification: {$ref: '#/components/schemas/QuestionClassification'}
        statementStart: {type: string, maxLength: 240}
    QuestionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/QuestionSummary'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    QuestionAlternative:
      type: object
      additionalProperties: false
      required: [id, content]
      properties: {id: {type: string, format: uuid}, content: {$ref: '#/components/schemas/QuestionText'}}
    QuestionReference:
      type: object
      additionalProperties: false
      required: [name, url]
      properties: {name: {type: string}, url: {type: string, format: uri}}
    QuestionDetail:
      type: object
      additionalProperties: false
      required: [questionId, revisionId, classification, statement, alternatives, references]
      properties:
        questionId: {type: string, format: uuid}
        revisionId: {type: string, format: uuid}
        classification: {$ref: '#/components/schemas/QuestionClassification'}
        statement: {$ref: '#/components/schemas/QuestionText'}
        alternatives: {type: array, minItems: 2, items: {$ref: '#/components/schemas/QuestionAlternative'}}
        references: {type: array, minItems: 1, items: {$ref: '#/components/schemas/QuestionReference'}}
    LessonPracticeView:
      type: object
      additionalProperties: false
      required: [id, topicId, createdAt, finishedAt, version, items]
      properties:
        id: {type: string, format: uuid}
        topicId: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 0}
        items: {type: array, minItems: 1, maxItems: 5, items: {$ref: '#/components/schemas/AttemptItem'}}
    LessonPracticeFinished:
      type: object
      additionalProperties: false
      required: [attempt, result]
      properties:
        attempt: {$ref: '#/components/schemas/LessonPracticeView'}
        result: {$ref: '#/components/schemas/AttemptResult'}
    LessonPracticeCreate:
      type: object
      additionalProperties: false
      required: [commandId, topicId]
      properties:
        commandId: {type: string, format: uuid}
        topicId: {type: string}
    LessonPracticeAvailability:
      type: object
      additionalProperties: false
      required: [topicId, available, maximum]
      properties:
        topicId: {type: string}
        available: {type: integer, minimum: 0}
        maximum: {type: integer, const: 5}
    LessonPracticeHistory:
      type: object
      additionalProperties: false
      required: [items, page, size]
      properties:
        page: {type: integer}
        size: {type: integer}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, topicId, createdAt, finishedAt, total, percentage]
            properties:
              id: {type: string, format: uuid}
              topicId: {type: string}
              createdAt: {type: string, format: date-time}
              finishedAt: {type: [string, 'null'], format: date-time}
              total: {type: integer, minimum: 1, maximum: 5}
              percentage: {type: [number, 'null']}
    AttemptCreate:
      type: object
      additionalProperties: false
      required: [commandId, roleId, disciplines]
      properties:
        commandId: {type: string, format: uuid}
        roleId: {type: string, enum: [assistente-administrativo, secretario-de-escola]}
        useParameterizedQuestions:
          type: boolean
          default: false
          description: Usa variações numéricas aprovadas quando disponíveis; pode misturar fixas e variações, sem garantir novidade. Ausente equivale a false; null e coerção de tipos não são aceitos.
        disciplines:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [disciplineId, quantity]
            properties:
              disciplineId: {type: string}
              quantity: {type: integer, minimum: 1, maximum: 100}
              topicIds: {type: array, uniqueItems: true, items: {type: string}}
    AttemptAnswer:
      type: object
      additionalProperties: false
      required: [commandId, expectedVersion, alternativeId]
      properties:
        commandId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 0}
        alternativeId: {type: [string, 'null'], format: uuid}
    AttemptItem:
      type: object
      additionalProperties: false
      required: [id, questionId, revisionId, classification, statement, alternatives, references, selectedAlternativeId]
      properties:
        id: {type: string, format: uuid}
        questionId: {type: string, format: uuid}
        revisionId: {type: string, format: uuid}
        classification: {$ref: '#/components/schemas/QuestionClassification'}
        statement: {$ref: '#/components/schemas/QuestionText'}
        alternatives: {type: array, minItems: 2, items: {$ref: '#/components/schemas/QuestionAlternative'}}
        references: {type: array, items: {$ref: '#/components/schemas/QuestionReference'}}
        selectedAlternativeId: {type: [string, 'null'], format: uuid}
    AttemptView:
      type: object
      additionalProperties: false
      required: [id, roleId, createdAt, finishedAt, version, items]
      properties:
        id: {type: string, format: uuid}
        roleId: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 0}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/AttemptItem'}}
    AttemptError:
      type: object
      additionalProperties: false
      required: [error]
      properties: {error: {type: string}}
    AttemptInsufficient:
      type: object
      additionalProperties: false
      required: [error, available]
      properties:
        error: {type: string, const: insufficient_pool}
        available:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [disciplineId, available]
            properties: {disciplineId: {type: string}, available: {type: integer, minimum: 0}}
    AttemptFinish:
      type: object
      additionalProperties: false
      required: [commandId, expectedVersion]
      properties: {commandId: {type: string, format: uuid}, expectedVersion: {type: integer, minimum: 0}}
    AttemptResult:
      type: object
      additionalProperties: false
      required: [total, points, correct, wrong, blank, percentage, items]
      properties:
        total: {type: integer}
        points: {type: integer}
        correct: {type: integer}
        wrong: {type: integer}
        blank: {type: integer}
        percentage: {type: number, minimum: 0, maximum: 100}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, correctAlternativeId, resolution]
            properties:
              item: {$ref: '#/components/schemas/AttemptItem'}
              correctAlternativeId: {type: string, format: uuid}
              resolution: {$ref: '#/components/schemas/QuestionText'}
    AttemptFinished:
      type: object
      additionalProperties: false
      required: [attempt, result]
      properties: {attempt: {$ref: '#/components/schemas/AttemptView'}, result: {$ref: '#/components/schemas/AttemptResult'}}
    AttemptHistory:
      type: object
      additionalProperties: false
      required: [items, page, size]
      properties:
        page: {type: integer}
        size: {type: integer}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, roleId, createdAt, finishedAt, total, percentage]
            properties:
              id: {type: string, format: uuid}
              roleId: {type: string}
              createdAt: {type: string, format: date-time}
              finishedAt: {type: [string, 'null'], format: date-time}
              total: {type: integer}
              percentage: {type: [number, 'null']}
    SubjectReviewSubject:
      type: object
      additionalProperties: false
      required: [topicId, title, disciplineId, disciplineTitle, correct, wrong, blank, assessed, exposures, percentage, lastFinishedAt]
