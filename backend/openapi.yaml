      properties:
        origin: {$ref: '#/components/schemas/AdminQuestionOrigin'}
        fingerprint: {type: [string, 'null']}
        match: {type: string, enum: [ABSENT, PRESENT, SAME_AS_LATEST, SAME_AS_ELIGIBLE, DIFFERENT]}
