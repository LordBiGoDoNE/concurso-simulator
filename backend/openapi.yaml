        responsible: {type: string}
        at: {type: string, format: date-time}
        checklist: {type: array, items: {type: string, enum: [CORRECTNESS, DISTRACTORS, CLARITY, STEP_BY_STEP, ACCESSIBILITY, SOURCES, CLASSIFICATION]}}
