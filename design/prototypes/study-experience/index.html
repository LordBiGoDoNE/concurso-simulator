    <script id="lesson-data" type="application/json">[{"id":"P01","title":"Interpretação de Textos","disciplineId":"portugues","path":"01_Portugues/Português 01 - Interpretação de Textos.html","sourceSha256":"2e495381c3c207e9a89931857bd21064f64c97f56354ac1a894942f4304f3bce","sections":[{"title":"1. Compreender não é adivinhar","paragraphs":["Interpretar um texto significa construir sentido a partir das informações que ele efetivamente oferece. A resposta correta precisa ser sustentada por palavras, relações ou pistas do próprio texto. Conhecimento de mundo ajuda a compreender, mas não autoriza acrescentar fatos que o autor não apresentou.","Em prova, uma alternativa pode ser verdadeira na vida real e, mesmo assim, estar errada porque não responde ao texto. O critério é textual: pergunte sempre “qual trecho sustenta esta conclusão?”."],"bullets":[]},{"title":"2. Explícito, implícito e inferência","paragraphs":["Informação explícita aparece de forma direta. Se o texto diz que o atendimento começa às 8h, não há inferência: basta localizar. A informação implícita exige uma dedução apoiada em pistas.","Inferir não é imaginar livremente. É combinar dados do texto de modo lógico. Quanto maior o salto entre o que foi dito e a alternativa, maior a chance de extrapolação."],"bullets":[]},{"title":"3. Tema, ideia principal e finalidade","paragraphs":["Tema é o assunto geral; costuma caber em poucas palavras. Ideia principal é o que o texto afirma sobre esse tema. Em um texto sobre digitalização de serviços públicos, o tema pode ser “serviços digitais”, enquanto a ideia principal pode ser “a digitalização aumenta a eficiência, mas exige inclusão digital”.","A finalidade responde ao propósito comunicativo: informar, explicar, orientar, persuadir, regulamentar, criticar, narrar, entre outros. O gênero dá pistas, mas a finalidade deve ser confirmada pelo conteúdo."],"bullets":[]}]},{"id":"P02","title":"Sinônimos, Antônimos e Relações de Sentido","disciplineId":"portugues","path":"01_Portugues/Português 02 - Sinônimos, Antônimos e Relações de Sentido.html","sourceSha256":"7d3ba17b3f52c0abfca0b52ea45b28dadaeddccdcf8bd79dcd2e098f155a8817","sections":[{"title":"1. Sinonímia depende do contexto","paragraphs":["Sinônimos são palavras de sentido próximo, não necessariamente idêntico em todos os contextos. “Casa” e “lar” podem se aproximar, mas “lar” traz frequentemente componente afetivo. “Começar” e “iniciar” são próximos, porém o registro e a construção sintática podem variar.","Em prova, a pergunta normalmente não é “estas palavras são sinônimas no dicionário?”, e sim “a substituição mantém o sentido neste trecho?”."],"bullets":[]},{"title":"2. Antonímia e oposição","paragraphs":["Antônimos expressam sentidos opostos, mas há tipos diferentes de oposição. “Quente/frio” admite gradação; “vivo/morto” tende à complementaridade; “comprar/vender” descreve uma relação inversa. Identificar o tipo ajuda a interpretar."],"bullets":[]},{"title":"3. Polissemia e contexto","paragraphs":["Uma mesma palavra pode assumir sentidos diferentes. “Banco” pode ser instituição financeira ou assento; “cabeça” pode ser parte do corpo ou líder. O contexto seleciona o sentido relevante."],"bullets":[]}]},{"id":"P03","title":"Sentido Próprio e Figurado","disciplineId":"portugues","path":"01_Portugues/Português 03 - Sentido Próprio e Figurado.html","sourceSha256":"918d0658176110673923f1351dfb8b5bb2081573896be2761d2aed1729e678a0","sections":[{"title":"1. Denotação e conotação","paragraphs":["Sentido próprio ou denotativo é o uso mais literal e convencional. Sentido figurado ou conotativo amplia ou desloca esse significado por associação. Em “a porta está aberta”, porta é literal; em “a educação abre portas”, “portas” representa oportunidades.","O contexto decide. A mesma palavra pode ser literal em uma frase e figurada em outra."],"bullets":[]},{"title":"2. Metáfora","paragraphs":["Metáfora aproxima realidades sem usar conectivo comparativo explícito. “Aquele servidor é uma ponte entre os setores” não o transforma fisicamente em ponte: atribui a ele a função de ligar partes."],"bullets":[]},{"title":"3. Metonímia","paragraphs":["Metonímia ocorre por relação de proximidade: autor pela obra (“li Machado de Assis”), recipiente pelo conteúdo (“bebeu um copo”), instituição por seus agentes (“a prefeitura informou”). Não é semelhança; é associação."],"bullets":[]}]},{"id":"P04","title":"Pontuação","disciplineId":"portugues","path":"01_Portugues/Português 04 - Pontuação.html","sourceSha256":"3ca43c9c3b66c519b59baef972d73a457312874c78e0e3cbd3dc74cb6b6eea2d","sections":[{"title":"1. A vírgula não marca “respiração”","paragraphs":["A pontuação organiza a estrutura sintática e o sentido. Uma pausa da fala pode coincidir com vírgula, mas esse não é o critério gramatical. O primeiro cuidado é identificar sujeito, verbo e complementos.","Em ordem direta, não se separa por vírgula o sujeito do verbo nem o verbo de seu objeto/complemento."],"bullets":[]},{"title":"2. Casos frequentes de vírgula","paragraphs":[],"bullets":["Isolar vocativo: “Senhores candidatos, leiam o aviso.”","Isolar aposto explicativo: “Limeira, município paulista, realizará a prova.”","Separar elementos de enumeração.","Marcar adjunto adverbial deslocado, especialmente quando longo."]},{"title":"3. Orações e conectivos","paragraphs":["Orações coordenadas adversativas introduzidas por “mas”, “porém”, “contudo” costumam ser separadas por vírgula. Orações adverbiais deslocadas para o início também são normalmente seguidas de vírgula.","Orações adjetivas explicativas ficam entre vírgulas; restritivas, não. A pontuação muda o alcance da informação."],"bullets":[]}]},{"id":"P05","title":"Ortografia e Acentuação","disciplineId":"portugues","path":"01_Portugues/Português 05 - Ortografia e Acentuação.html","sourceSha256":"955f2170dce7d0d7a8f92f70b0710b319a3ceae26880fb46406ccd3b911d5bf5","sections":[{"title":"1. Ortografia é convenção","paragraphs":["A ortografia padroniza a escrita. Nem sempre a pronúncia permite deduzir a grafia; por isso, leitura e contato com palavras recorrentes são essenciais. Em concurso, aparecem trocas de s/z, x/ch, g/j, além de palavras parônimas."],"bullets":[]},{"title":"3. Hiato e ditongo","paragraphs":["Em hiatos, “i” e “u” tônicos podem receber acento quando formam sílaba sozinhos ou com “s”, observadas exceções. Exemplos tradicionais: saída, baú. Ditongos abertos em palavras oxítonas como “herói” e “chapéu” recebem acento; em paroxítonas, formas como “ideia” não recebem mais acento."],"bullets":[]},{"title":"5. Há x a","paragraphs":["“Há” pode indicar existência ou tempo decorrido: “há vagas”; “há dois anos”. “A” pode marcar tempo futuro ou distância: “daqui a dois dias”; “a três quilômetros”."],"bullets":[]}]},{"id":"P06","title":"Classes de Palavras","disciplineId":"portugues","path":"01_Portugues/Português 06 - Classes de Palavras.html","sourceSha256":"97291aed5479f14d7d9585156baa1250631f58302f76cf5323b49f8d0f282f39","sections":[{"title":"1. Classe depende do funcionamento","paragraphs":["A classificação não deve ser feita apenas pela aparência da palavra. “Jantar” é verbo em “vamos jantar” e substantivo em “o jantar está pronto”. O artigo é um forte sinal de substantivação.","Em prova, a banca costuma destacar uma palavra e perguntar sua classe no trecho. Leia o entorno e observe o que ela modifica ou substitui."],"bullets":[]},{"title":"3. Verbo e advérbio","paragraphs":["Verbo expressa ação, estado, fenômeno ou processo e varia em tempo, modo, pessoa e número. Advérbio modifica verbo, adjetivo, outro advérbio ou toda a oração, indicando circunstâncias como tempo, modo, lugar e intensidade.","Em “chegou muito cedo”, “cedo” modifica “chegou” e “muito” intensifica “cedo”."],"bullets":[]},{"title":"4. Preposição e conjunção","paragraphs":["Preposição liga termos e estabelece relações: de, em, a, para, com, por etc. Conjunção liga orações ou termos de função semelhante e explicita relações lógicas: adição, oposição, causa, condição, conclusão."],"bullets":[]}]},{"id":"P07","title":"Concordância Verbal e Nominal","disciplineId":"portugues","path":"01_Portugues/Português 07 - Concordância Verbal e Nominal.html","sourceSha256":"ce0310fdba38beefd3aa2a8c9e74385735dc21949b7da29afc9f18d74d03ed59","sections":[{"title":"1. Regra geral verbal","paragraphs":["O verbo concorda em número e pessoa com o núcleo do sujeito. “Os documentos chegaram”; “A documentação chegou”. Antes de olhar o substantivo mais próximo do verbo, identifique o núcleo real do sujeito."],"bullets":[]},{"title":"2. Sujeito composto","paragraphs":["Sujeito composto anteposto tende a levar o verbo ao plural: “O diretor e a secretária assinaram”. Quando posposto, há construções em que a concordância pode variar conforme a norma e o contexto, mas em concurso é essencial reconhecer a forma plural como opção segura quando os núcleos são distintos."],"bullets":[]},{"title":"3. Verbos impessoais","paragraphs":["“Haver” com sentido de existir ou ocorrer é impessoal e fica no singular: “Havia problemas”, “Houve reuniões”. O verbo “fazer” indicando tempo decorrido ou fenômeno meteorológico também permanece no singular: “Faz dois anos”.","Em locução verbal, a impessoalidade se transmite ao auxiliar: “Deve haver vagas”, e não “devem haver”."],"bullets":[]}]},{"id":"P08","title":"Regência Verbal e Nominal","disciplineId":"portugues","path":"01_Portugues/Português 08 - Regência Verbal e Nominal.html","sourceSha256":"7cb6bdfa306f630db664d4bad39b3481ec7133a50ff2a4a94be7fa0ed80e165f","sections":[{"title":"1. O que é regência","paragraphs":["Regência estuda a relação entre um termo regente e seu complemento. Alguns verbos ligam-se diretamente ao complemento; outros exigem preposição. Em “necessitar de apoio”, o verbo exige “de”.","A regência é central para crase: só pode haver crase antes de termo feminino quando o termo anterior exige a preposição “a” e o termo seguinte admite artigo “a”."],"bullets":[]},{"title":"3. Mudança de sentido","paragraphs":["Alguns verbos mudam de regência conforme o significado. “Assistir o paciente” pode significar prestar assistência (transitivo direto); “assistir ao filme” significa ver/presenciar. “Aspirar o ar” é sorver (direto); “aspirar ao cargo” é desejar (preposição a)."],"bullets":[]},{"title":"4. Regência nominal","paragraphs":["Nomes também podem exigir preposição: “necessidade de”, “favorável a”, “capaz de”, “respeito a/por”, “compatível com”. Em prova, observe a combinação entre adjetivo/substantivo e seu complemento."],"bullets":[]}]},{"id":"P09","title":"Colocação Pronominal","disciplineId":"portugues","path":"01_Portugues/Português 09 - Colocação Pronominal.html","sourceSha256":"34d1c23539b950c1527004bef4457f5ed35131a8a60f374096836a6e08bd2fc8","sections":[{"title":"2. Fatores de próclise","paragraphs":["Palavras negativas, pronomes relativos, indefinidos, interrogativos, conjunções subordinativas e certos advérbios podem atrair o pronome. Exemplos: “Não me diga”; “Quem te informou?”; “Quando me chamarem, irei”."],"bullets":[]},{"title":"3. Ênclise e início de oração","paragraphs":["Na tradição da norma-padrão escrita, evita-se iniciar oração com pronome oblíquo átono: prefere-se “Informaram-me” a “Me informaram” em contexto formal de prova. Sem fator de atração, a ênclise pode ser adequada."],"bullets":[]},{"title":"4. Mesóclise","paragraphs":["A mesóclise ocorre com futuro do presente ou futuro do pretérito quando não há fator de próclise: “Enviar-lhe-ei”. É pouco comum na fala, mas pode aparecer em questões normativas. Se houver atrativo, usa-se próclise: “Não lhe enviarei”."],"bullets":[]}]},{"id":"P10","title":"Crase","disciplineId":"portugues","path":"01_Portugues/Português 10 - Crase.html","sourceSha256":"5abebc9dcc4f5376037ddbab76133fef664890ca1271a7f79b6bd6ce180f6cc4","sections":[{"title":"1. O que é crase","paragraphs":["Crase é a fusão de dois sons/vogais “a”. Na escrita, o acento grave marca essa fusão. O caso mais frequente é preposição “a” exigida pelo termo anterior + artigo feminino “a/as” admitido pelo termo seguinte: “dirigir-se à escola”.","Portanto, não basta haver palavra feminina. É preciso verificar duas condições: regência antes e possibilidade de artigo depois."],"bullets":[]},{"title":"2. Teste do masculino","paragraphs":["Troque o termo feminino por masculino equivalente. Se surgir “ao”, há forte indicação de crase: “fui à escola” → “fui ao colégio”. Se ficar apenas “a”, não há crase: “entreguei a ela” → não existe “ao ele”."],"bullets":[]},{"title":"3. Casos comuns de crase","paragraphs":[],"bullets":["Antes de locuções femininas: à tarde, à medida que, às vezes.","Antes de nome feminino que admite artigo e é regido por “a”.","Com horas determinadas: às 8h, à uma hora.","Com demonstrativos aquele(s), aquela(s), aquilo, quando houver preposição: referi-me àquele processo."]}]},{"id":"M01","title":"Operações com Números Reais","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 01 - Operações com Números Reais.html","sourceSha256":"3bb75f4386757f34b222293112833f3c9b8e6d7418f071a5dac294af170c1daa","sections":[{"title":"1. Conjuntos numéricos na prática","paragraphs":["Nos concursos de nível médio, “números reais” reúne naturais, inteiros, racionais e irracionais. O foco é operacional: sinais, frações, decimais, potências e raízes.","Ao transformar um decimal finito em fração, use potência de 10: 0,25 = 25/100 = 1/4."],"bullets":[]},{"title":"3. Frações","paragraphs":["Para somar ou subtrair frações, iguale denominadores; para multiplicar, multiplique numeradores e denominadores; para dividir, multiplique pela inversa da segunda fração. Simplifique sempre que possível."],"bullets":[]},{"title":"4. Ordem das operações","paragraphs":["A sequência segura é: parênteses/agrupamentos; potências e raízes; multiplicações e divisões; adições e subtrações. Operações do mesmo nível são resolvidas da esquerda para a direita."],"bullets":[]}]},{"id":"M02","title":"MMC e MDC","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 02 - MMC e MDC.html","sourceSha256":"283c9a5ff6355d32b89049404d565d3940a5b20b9b5c325bf1438dd79e09188d","sections":[{"title":"1. Múltiplos e divisores","paragraphs":["Múltiplos de um número são obtidos por multiplicação; divisores são números que o dividem exatamente. Essa diferença orienta a escolha entre MMC e MDC."],"bullets":[]},{"title":"2. Fatoração prima","paragraphs":["Escreva cada número como produto de fatores primos. Ex.: 12=2²×3 e 18=2×3². Para MMC, pegue todos os fatores com maior expoente; para MDC, apenas fatores comuns com menor expoente."],"bullets":[]},{"title":"3. Quando usar MMC","paragraphs":[],"bullets":["Sincronização de ciclos (“a cada 6 e a cada 8 minutos”).","Somar frações com denominadores diferentes.","Encontrar menor quantidade compatível com várias periodicidades."]}]},{"id":"M03","title":"Razão, Proporção e Regra de Três","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 03 - Razão, Proporção e Regra de Três.html","sourceSha256":"db74dfc3b44befdc77c81f44b3e81e7f7f320804682874691eb8fdb6935d6248","sections":[{"title":"1. Razão e proporção","paragraphs":["Razão compara duas grandezas por divisão: a/b. Proporção é a igualdade entre duas razões: a/b=c/d, com propriedade fundamental ad=bc. Sempre confira unidades."],"bullets":[]},{"title":"3. Regra de três simples","paragraphs":["Organize grandezas em colunas, alinhe unidades, determine se a relação é direta ou inversa e só então monte a proporção. Não use “multiplicação cruzada” sem interpretar."],"bullets":[]},{"title":"4. Regra de três composta","paragraphs":["Há três ou mais grandezas. Fixe a grandeza da incógnita e compare cada outra grandeza com ela, identificando direta/inversa. Monte o produto das razões coerentemente."],"bullets":[]}]},{"id":"M04","title":"Porcentagem e Juros Simples","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 04 - Porcentagem e Juros Simples.html","sourceSha256":"30657317d1a6875ad8716cce8cd2fcde81338e4f5dc1ed03339cebbc13d03811","sections":[{"title":"1. Porcentagem: o que significa e como calcular","paragraphs":["Por cento significa “a cada cem”. O símbolo % indica quantas partes pegamos de um inteiro dividido em 100 partes iguais. O inteiro pode ser uma quantia em dinheiro, um grupo de pessoas ou outra quantidade.","Assim, 100% é o inteiro; 50% é a metade; 25% é um quarto. E 15% significa 15 de cada 100 partes."],"bullets":[]},{"title":"2. Desconto e aumento: quanto fica no final?","paragraphs":["Primeiro calcule a parte; depois decida se deve tirar ou acrescentar. A palavra “desconto” indica subtração. “Aumento” indica adição."],"bullets":[]},{"title":"3. Duas mudanças seguidas: a base muda","paragraphs":["A base é o valor sobre o qual calculamos a porcentagem. Depois do primeiro aumento ou desconto, esse valor pode mudar."],"bullets":[]}]},{"id":"M05","title":"Média Aritmética e Ponderada","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 05 - Média Aritmética e Ponderada.html","sourceSha256":"1c24e980997e4aab9d3e4b0f7ea02f15e66d89425e17ccb4c6c1c5c7715977db","sections":[{"title":"1. Média simples","paragraphs":["Média aritmética = soma dos valores ÷ quantidade. Ela representa um ponto de equilíbrio. Se a média de 5 valores é 8, a soma deve ser 40."],"bullets":[]},{"title":"2. Média ponderada","paragraphs":["Quando valores têm pesos diferentes, multiplique cada valor pelo peso, some os produtos e divida pela soma dos pesos. Não divida apenas pela quantidade de notas."],"bullets":[]},{"title":"3. Média e total","paragraphs":["Total = média × quantidade. Essa identidade é especialmente útil em problemas que informam média e pedem um valor ausente."],"bullets":[]}]},{"id":"M06","title":"Equações e Sistemas do 1º Grau","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 06 - Equações e Sistemas do 1º Grau.html","sourceSha256":"4092c28e441b595e3db7750d0bec3d637913cd6aea8304dd5c38d9eb494614e3","sections":[{"title":"1. Equação como equilíbrio","paragraphs":["Uma equação afirma igualdade. Qualquer operação feita em um lado deve ser feita no outro. A meta é isolar a incógnita preservando a equivalência."],"bullets":[]},{"title":"2. Distributiva e redução","paragraphs":["Remova parênteses com distributiva, junte termos semelhantes e só depois isole x. Cuidado com sinal negativo antes de parênteses."],"bullets":[]},{"title":"3. Problemas","paragraphs":["Defina a incógnita em uma frase (“x = número de documentos”), traduza as relações e, no final, verifique se a solução atende ao contexto."],"bullets":[]}]},{"id":"M07","title":"Tabelas e Gráficos","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 07 - Tabelas e Gráficos.html","sourceSha256":"9ae45681c8337a6c1f89e30e996b0298db9acf8e6b6a221252eadacf46f7310f","sections":[{"title":"1. Leia título, unidade e fonte","paragraphs":["Antes de calcular, identifique o que está sendo medido, em que unidade e qual período. Muitos erros vêm de misturar milhares com unidades ou percentuais com valores absolutos."],"bullets":[]},{"title":"2. Variação absoluta x percentual","paragraphs":["Variação absoluta=final−inicial. Variação percentual=(final−inicial)/inicial×100%. Uma grande variação absoluta pode representar pequeno percentual quando a base é grande."],"bullets":[]},{"title":"3. Escalas de eixos","paragraphs":["Gráficos com eixo vertical truncado podem amplificar visualmente diferenças. Em prova, use valores e escala, não a impressão visual."],"bullets":[]}]},{"id":"M08","title":"Sistemas de Medidas","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 08 - Sistemas de Medidas.html","sourceSha256":"4b98a50227856b1488af6cd750056035ac93db8ff616690e1b8fa67d51bea0c9","sections":[{"title":"1. Comprimento","paragraphs":["No sistema métrico, cada passo entre km-hm-dam-m-dm-cm-mm multiplica ou divide por10. Ex.: 2,4m=240cm."],"bullets":[]},{"title":"2. Área","paragraphs":["Como a unidade está ao quadrado, cada passo vale fator100. 1m²=10.000cm², pois 1m=100cm e 100²=10.000."],"bullets":[]},{"title":"3. Volume e capacidade","paragraphs":["No volume, cada passo cúbico vale fator1000. Relação útil: 1dm³=1L; 1cm³=1mL."],"bullets":[]}]},{"id":"M09","title":"Geometria- Perímetro, Área, Volume, Ângulos e Pitágoras","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Matemática 09 - Geometria- Perímetro, Área, Volume, Ângulos e Pitágoras.html","sourceSha256":"2754be47dd1c2a860ac98abe02dfa0036ad20013c0e410a5d29de56c6f03e24d","sections":[{"title":"1. Perímetro e área","paragraphs":["Perímetro mede contorno; área mede superfície. Retângulo: P=2(b+h), A=b·h. Quadrado: P=4l, A=l². Triângulo: A=b·h/2."],"bullets":[]},{"title":"2. Circunferência e círculo","paragraphs":["Comprimento da circunferência C=2πr; área do círculo A=πr². Leia se o problema pede contorno ou superfície."],"bullets":[]},{"title":"3. Volume","paragraphs":["Paralelepípedo retângulo: V=comprimento×largura×altura. A unidade final é cúbica."],"bullets":[]}]},{"id":"M10","title":"Relações Lógicas, Dedução e Sequências","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Raciocínio Lógico 10 - Relações Lógicas, Dedução e Sequências.html","sourceSha256":"4b01d455024d91daaa73b76a0b646369d074516df484d923a544a9321c86634f","sections":[{"title":"1. Transforme texto em estrutura","paragraphs":["Questões de relações ficam mais simples quando você cria tabela, fila, desenho ou símbolos. Separe fato dado de conclusão deduzida. Não acrescente suposições."],"bullets":[]},{"title":"2. Condições e restrições","paragraphs":["Expressões como “à esquerda”, “antes”, “não pode”, “exatamente um”, “pelo menos” precisam ser preservadas literalmente. Uma dedução é válida quando ocorre em todas as configurações que respeitam as condições."],"bullets":[]},{"title":"3. Sequências numéricas","paragraphs":["Teste primeiro padrões simples: diferenças, razões, alternância, operações intercaladas, quadrados e números primos. Evite escolher uma regra complexa se uma regularidade simples explica todos os termos."],"bullets":[]}]},{"id":"M11","title":"Estruturas e Argumentação Lógica","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Raciocínio Lógico 11 - Estruturas e Argumentação Lógica.html","sourceSha256":"fd41c96784df50824b56ddb3a20305683c4730b100ecba349107bfc192138ebd","sections":[{"title":"1. Proposição","paragraphs":["Proposição é sentença declarativa à qual se pode atribuir valor verdadeiro ou falso. Perguntas, ordens e exclamações normalmente não são proposições no sentido lógico."],"bullets":[]},{"title":"3. Negação","paragraphs":["Negar “p e q” produz “não p ou não q”; negar “p ou q” produz “não p e não q” (Leis de De Morgan). Negar “todo A é B” é afirmar “existe pelo menos um A que não é B”."],"bullets":[]},{"title":"4. Condicional e contrapositiva","paragraphs":["“Se p então q” é equivalente a “se não q então não p” (contrapositiva). Não é equivalente à inversa “se q então p”."],"bullets":[]}]},{"id":"M12","title":"Diagramas Lógicos e Situações-Problema","disciplineId":"matematica-raciocinio","path":"02_Matematica_Logica/Raciocínio Lógico 12 - Diagramas Lógicos e Situações-Problema.html","sourceSha256":"948f40dd64525d516f6dac886ace8a2a2b65c1e2802dc18e73f291803b963d33","sections":[{"title":"1. Linguagem de conjuntos","paragraphs":["“Todo A é B” significa A contido em B. “Nenhum A é B” significa conjuntos disjuntos. “Algum A é B” exige interseção não vazia. Desenhar círculos reduz ambiguidade."],"bullets":[]},{"title":"2. União e interseção","paragraphs":["União A∪B reúne elementos de A ou B; interseção A∩B reúne elementos comuns. Para contagem de dois conjuntos: |A∪B|=|A|+|B|−|A∩B|."],"bullets":[]},{"title":"3. Complemento","paragraphs":["Complemento de A, dentro de um universo U, são elementos de U que não pertencem a A. Questões “não usa nenhum dos dois serviços” frequentemente pedem complemento da união."],"bullets":[]}]},{"id":"I01","title":"Windows - Arquivos, Pastas e Diretórios","disciplineId":"informatica","path":"03_Informatica/Informática 01 - Windows - Arquivos, Pastas e Diretórios.html","sourceSha256":"7200fb94f96f4fa6bf7838199492187421b85df363ef2afeb4de10508776d1b4","sections":[{"title":"1. Arquivo, pasta e caminho","paragraphs":["Arquivo é uma unidade de informação gravada, normalmente identificada por nome e extensão. Pasta ou diretório é um contêiner lógico que organiza arquivos e outras pastas. Caminho descreve a localização, por exemplo C:\\Usuários\\Gaby\\Documentos\\prova.pdf.","A raiz de uma unidade é seu nível superior. Pastas podem conter subpastas em estrutura hierárquica."],"bullets":[]},{"title":"3. Copiar x mover","paragraphs":["Copiar cria uma segunda instância dos dados no destino, preservando a origem. Mover altera a localização lógica. Arrastar entre pastas da mesma unidade costuma mover por padrão; entre unidades diferentes, costuma copiar — mas prova pode focar nos comandos explícitos, que são menos ambíguos."],"bullets":[]},{"title":"4. Exclusão e Lixeira","paragraphs":["A exclusão comum de arquivo local geralmente envia para a Lixeira, de onde pode ser restaurado enquanto não removido definitivamente. Shift+Delete costuma excluir sem enviar à Lixeira. Em mídias e contextos específicos o comportamento pode variar."],"bullets":[]}]},{"id":"I02","title":"Windows - Atalhos, Área de Trabalho e Área de Transferência","disciplineId":"informatica","path":"03_Informatica/Informática 02 - Windows - Atalhos, Área de Trabalho e Área de Transferência.html","sourceSha256":"7e72fe8d4b22ca19b616a205735b369dd268d936d43b6f910c3d0b16a5172b11","sections":[{"title":"1. Área de trabalho e interface","paragraphs":["A Área de Trabalho é um espaço de interface que pode conter ícones, atalhos e arquivos. A barra de tarefas dá acesso a aplicativos abertos/fixados, pesquisa, área de notificação e outros recursos, conforme versão/configuração."],"bullets":[]},{"title":"2. Área de transferência","paragraphs":["A área de transferência mantém temporariamente dados copiados ou recortados para posterior colagem. Ctrl+C copia; Ctrl+X recorta; Ctrl+V cola. Em versões atuais, Win+V pode abrir histórico da área de transferência se o recurso estiver habilitado."],"bullets":[]},{"title":"4. Atalhos x arquivos","paragraphs":["Um atalho é uma referência para um alvo. Excluir o atalho normalmente não exclui o arquivo/programa original. O ícone costuma ter indicação visual própria."],"bullets":[]}]},{"id":"I03","title":"Word - Edição e Formatação","disciplineId":"informatica","path":"03_Informatica/Informática 03 - Word - Edição e Formatação.html","sourceSha256":"708636bf10931ac3c9ea478dd3fcd61b134648a1b511e63980788553f2ac1219","sections":[{"title":"1. Estrutura do documento","paragraphs":["Um documento do Word é composto por texto, parágrafos, seções e objetos. Formatação de caractere afeta fonte, tamanho, negrito, itálico etc.; formatação de parágrafo afeta alinhamento, recuos, espaçamento e listas."],"bullets":[]},{"title":"3. Parágrafo","paragraphs":["Recuos controlam posição das linhas em relação às margens; espaçamento antes/depois controla distância entre parágrafos; espaçamento entre linhas controla distância vertical dentro do parágrafo. Enter cria novo parágrafo; Shift+Enter insere quebra de linha manual sem novo parágrafo."],"bullets":[]},{"title":"4. Edição e revisão","paragraphs":["Localizar pesquisa texto; Substituir troca ocorrências de forma controlada. Ctrl+H costuma abrir Substituir. Desfazer/refazer ajudam a corrigir alterações. O recurso “Mostrar tudo” (¶) exibe marcas não imprimíveis, útil para diagnosticar formatação."],"bullets":[]}]},{"id":"I04","title":"Word - Tabelas, Páginas, Índices e Objetos","disciplineId":"informatica","path":"03_Informatica/Informática 04 - Word - Tabelas, Páginas, Índices e Objetos.html","sourceSha256":"5216cf65e2a1e3c3c51093794cb37f8bad34ef6855329b70e345db3b2147b413","sections":[{"title":"1. Tabelas","paragraphs":["Tabelas são compostas por linhas, colunas e células. É possível inserir/excluir linhas e colunas, mesclar/dividir células, ajustar largura, alinhar conteúdo e aplicar estilos. Tabela não é planilha completa: embora possa fazer cálculos simples, o Excel é mais adequado para análise numérica."],"bullets":[]},{"title":"2. Quebra de página x seção","paragraphs":["Quebra de página força conteúdo seguinte para nova página. Quebra de seção cria uma nova seção que pode ter margens, orientação, cabeçalho/rodapé e numeração diferentes."],"bullets":[]},{"title":"3. Numeração e campos","paragraphs":["Número de página é normalmente um campo automático, não texto digitado manualmente em cada página. Campos podem exibir data, propriedades e outras informações dinâmicas."],"bullets":[]}]},{"id":"I05","title":"Excel - Células, Linhas, Colunas e Referências","disciplineId":"informatica","path":"03_Informatica/Informática 05 - Excel - Células, Linhas, Colunas e Referências.html","sourceSha256":"edc881ec1d94fbe634b8d380741aa5650445f5cb3c79c38b89a5566d55215abb","sections":[{"title":"1. Estrutura","paragraphs":["Uma pasta de trabalho pode conter várias planilhas. Cada planilha tem linhas numeradas e colunas identificadas por letras. A interseção forma a célula: A1, C7, AA15. Intervalo A1:A5 indica células contínuas entre A1 e A5."],"bullets":[]},{"title":"3. Fórmula e conteúdo","paragraphs":["Fórmulas começam normalmente com =. Se A1=10 e B1=20, =A1+B1 resulta em30. Ao copiar para a linha seguinte, referências relativas ajustam-se para A2+B2."],"bullets":[]},{"title":"4. Intervalos e operadores","paragraphs":["Dois-pontos define intervalo contínuo: A1:A10. Ponto e vírgula, em instalações em português, é frequentemente separador de argumentos de funções, não operador de intervalo. A sintaxe pode variar conforme configuração regional."],"bullets":[]}]},{"id":"I06","title":"Excel - Fórmulas e Funções","disciplineId":"informatica","path":"03_Informatica/Informática 06 - Excel - Fórmulas e Funções.html","sourceSha256":"49047b705f986365ec0e47e9f8524e93ce0653ffe2325cb3b12f7ce777774842","sections":[{"title":"1. Operadores e precedência","paragraphs":["Parênteses controlam ordem. Sem eles, potência vem antes de multiplicação/divisão, que vêm antes de soma/subtração. Em Excel, =2+3*4 resulta14; =(2+3)*4 resulta20."],"bullets":[]},{"title":"3. Função SE","paragraphs":["SE testa condição e retorna um valor se verdadeira e outro se falsa. Exemplo: =SE(A1>=60;\"Aprovado\";\"Reprovado\"). O separador pode ser ; em configuração brasileira."],"bullets":[]},{"title":"4. Funções com critério","paragraphs":["CONT.SE conta células que atendem a um critério, por exemplo =CONT.SE(B2:B20;\">=80\"). SOMASE soma valores associados a um critério. É importante diferenciar intervalo de critério e intervalo de soma."],"bullets":[]}]},{"id":"I07","title":"Excel - Tabelas, Gráficos, Classificação e Dados","disciplineId":"informatica","path":"03_Informatica/Informática 07 - Excel - Tabelas, Gráficos, Classificação e Dados.html","sourceSha256":"96e597456bb55c227c30b1f5f7823b332d97a17f61a93bc783acb2c63b8f81cb","sections":[{"title":"1. Classificar x filtrar","paragraphs":["Classificar muda a ordem de exibição dos registros segundo critérios (A-Z, maior-menor, múltiplos níveis). Filtrar oculta temporariamente linhas que não atendem aos critérios, sem apagá-las."],"bullets":[]},{"title":"2. Gráficos","paragraphs":["Colunas/barras comparam categorias; linhas mostram evolução temporal; setores/pizza destacam composição de um todo com poucas categorias. A escolha inadequada pode dificultar interpretação."],"bullets":[]},{"title":"3. Tabelas do Excel","paragraphs":["Transformar intervalo em Tabela adiciona cabeçalhos, filtros, expansão automática e referências estruturadas, entre outros recursos. Não confunda tabela comum de células com Tabela formal do Excel."],"bullets":[]}]},{"id":"I08","title":"Excel - Macros","disciplineId":"informatica","path":"03_Informatica/Informática 08 - Excel - Macros.html","sourceSha256":"600ecccb72b475784db32e080e9c670ebeb6cd1a6666f0eae66765e122e04342","sections":[{"title":"1. Conceito","paragraphs":["Macro é uma sequência automatizada de comandos/ações. No Office, muitas macros usam VBA (Visual Basic for Applications). Podem ser gravadas ou programadas para repetir tarefas."],"bullets":[]},{"title":"2. Macro x fórmula","paragraphs":["Fórmula calcula valor em célula; macro pode manipular planilhas, formatar, importar dados, executar rotinas e interagir com objetos. São conceitos diferentes."],"bullets":[]},{"title":"3. Segurança","paragraphs":["Macros podem executar código e, portanto, representar risco. Não se deve habilitar macros de origem desconhecida. O Office possui configurações de segurança, locais confiáveis e assinaturas digitais."],"bullets":[]}]},{"id":"I09","title":"PowerPoint - Apresentações, Edição, Animações e Transições","disciplineId":"informatica","path":"03_Informatica/Informática 09 - PowerPoint - Apresentações, Edição, Animações e Transições.html","sourceSha256":"a5b161e6e353c9630a3572451653f52fe8dd85338a40a107d4863975d32a67ab","sections":[{"title":"1. Estrutura","paragraphs":["Apresentação é o arquivo completo; slide é cada página/tela. Layout define disposição de espaços reservados; tema padroniza elementos visuais como cores, fontes e efeitos."],"bullets":[]},{"title":"2. Objetos e organização","paragraphs":["Slides podem conter caixas de texto, imagens, formas, tabelas, gráficos, áudio e vídeo. Alinhar, distribuir, agrupar e ordenar objetos ajuda na composição. Régua e guias auxiliam posicionamento."],"bullets":[]},{"title":"3. Transição x animação","paragraphs":["Transição ocorre entre slides. Animação afeta objetos dentro de um slide, controlando entrada, ênfase, saída ou trajetória. Essa diferença é clássica em prova."],"bullets":[]}]},{"id":"I10","title":"E-mail, Internet, URL, Links e Busca","disciplineId":"informatica","path":"03_Informatica/Informática 10 - E-mail, Internet, URL, Links e Busca.html","sourceSha256":"a41bd8b7c1494fb65f0fd99fb976d6395e29ae7d31bcb5fa557af969cd021073","sections":[{"title":"1. E-mail: Para, Cc e Cco","paragraphs":["Para indica destinatários principais; Cc envia cópia visível; Cco envia cópia oculta aos demais destinatários. Responder a todos inclui participantes conforme configuração e deve ser usado com cuidado."],"bullets":[]},{"title":"2. Anexos","paragraphs":["Anexo é arquivo enviado junto à mensagem. Tamanho pode ser limitado pelo serviço. Links de compartilhamento em nuvem não são tecnicamente o mesmo que anexar os bytes do arquivo, embora cumpram finalidade semelhante."],"bullets":[]},{"title":"3. URL e link","paragraphs":["URL identifica um recurso. Ex.: https://exemplo.com/pasta/pagina. “https” é esquema/protocolo; “exemplo.com” é domínio/host; o restante é caminho. Link é elemento clicável que aponta para um endereço/recurso."],"bullets":[]}]},{"id":"A01","title":"Princípios da Administração Pública","disciplineId":"conhecimentos-administrativos","path":"04_Assistente_Administrativo/Assistente Administrativo 01 - Princípios da Administração Pública.html","sourceSha256":"580e824e675dc7326ddcedc9707a58368aaf1a769296c82c58c4a205dc8329e2","sections":[{"title":"1. Visão geral — LIMPE","paragraphs":["O edital cobra os princípios da legalidade, impessoalidade, moralidade, publicidade e eficiência. Eles orientam a atuação administrativa e precisam ser entendidos de forma prática, não apenas decorados pela sigla.","Em questões, o enunciado costuma apresentar uma conduta e pedir qual princípio foi respeitado ou violado. A solução depende do elemento central da situação."],"bullets":[]},{"title":"2. Legalidade","paragraphs":["Na Administração Pública, o agente atua dentro das competências e autorizações previstas pelo ordenamento. A ideia não é simplesmente “fazer o que a lei não proíbe”, como se costuma dizer do particular; a atuação administrativa deve encontrar fundamento jurídico e respeitar limites."],"bullets":[]},{"title":"3. Impessoalidade","paragraphs":["Impessoalidade exige finalidade pública, tratamento sem favorecimentos pessoais e atuação atribuída ao órgão, não à promoção individual do agente. A publicidade institucional não deve ser instrumento de autopromoção."],"bullets":[]}]},{"id":"A02","title":"Rotinas Administrativas e Redação Técnica","disciplineId":"conhecimentos-administrativos","path":"04_Assistente_Administrativo/Assistente Administrativo 02 - Rotinas Administrativas e Redação Técnica.html","sourceSha256":"b98cb7c3693a755db8da0a9d8ac7d7d8df4141c2f19f5f2bc732a8c1775e1b99","sections":[{"title":"1. Rotina administrativa","paragraphs":["Rotina administrativa é o conjunto de procedimentos repetidos que mantém o fluxo de trabalho: receber demandas, registrar, distribuir, acompanhar, arquivar e comunicar resultados. Uma boa rotina define responsabilidades, prazos, registros e pontos de controle."],"bullets":[]},{"title":"2. Ata","paragraphs":["Ata registra acontecimentos e deliberações de reunião. Deve permitir reconstruir o que ocorreu: data, local, participantes ou quórum conforme prática adotada, assuntos, decisões e encerramento. O foco é fidelidade e clareza, evitando opiniões pessoais do redator."],"bullets":[]},{"title":"3. Ofício e memorando","paragraphs":["Ofícios são comunicações oficiais formais entre unidades, autoridades ou destinatários externos conforme a organização. Memorandos são tradicionalmente associados à comunicação interna. A terminologia pode variar em sistemas modernos, por isso em prova é importante seguir o conceito indicado pelo edital/contexto."],"bullets":[]}]},{"id":"A03","title":"Processos Administrativos- Autuação, Registro e Encaminhamento","disciplineId":"conhecimentos-administrativos","path":"04_Assistente_Administrativo/Assistente Administrativo 03 - Processos Administrativos- Autuação, Registro e Encaminhamento.html","sourceSha256":"ba11360821c655b7ff16354b590c9d6eb6857a034dce8f0e624d3f99056e57e4","sections":[{"title":"1. Do documento ao processo","paragraphs":["Um processo administrativo reúne documentos e registros relacionados a uma demanda para permitir análise, decisão e comprovação dos atos. O fluxo deve preservar identidade, ordem, integridade e rastreabilidade."],"bullets":[]},{"title":"2. Autuação","paragraphs":["Autuar é formalizar a abertura do processo a partir de documentação inicial, atribuindo identificação e organizando seus elementos conforme regras do órgão/sistema. A autuação transforma a demanda em unidade processual controlável."],"bullets":[]},{"title":"3. Registro e numeração","paragraphs":["Registro insere dados essenciais no sistema/livro de protocolo: interessado, assunto, origem, data, número e outros campos. Numeração permite individualizar e recuperar o processo. Evite duplicidades e alterações sem trilha de auditoria."],"bullets":[]}]},{"id":"A04","title":"Gestão de Materiais e Suprimentos","disciplineId":"conhecimentos-administrativos","path":"04_Assistente_Administrativo/Assistente Administrativo 04 - Gestão de Materiais e Suprimentos.html","sourceSha256":"debef230ba387d82fc266b4b645d3bb7e2fd88c9bffa61d488db67dd6931909b","sections":[{"title":"1. Recebimento","paragraphs":["Receber material não significa aceitá-lo automaticamente. A etapa inclui identificação do pedido/fornecedor e conferência da entrega. Divergências devem ser registradas e tratadas antes da aceitação definitiva, conforme procedimento."],"bullets":[]},{"title":"2. Conferência quantitativa e qualitativa","paragraphs":["Conferência quantitativa verifica quantidade/unidades. Qualitativa compara especificações: modelo, marca quando exigida, dimensão, validade, integridade e demais requisitos. A nota fiscal deve ser confrontada com pedido/contrato e entrega física."],"bullets":[]},{"title":"3. Armazenamento","paragraphs":["Materiais devem ser identificados e acondicionados de forma compatível, evitando deterioração, perda, mistura e riscos. Endereçamento de estoque facilita localização. Itens com validade exigem controle por lote/data."],"bullets":[]}]},{"id":"A05","title":"Arquivística e Gestão Documental","disciplineId":"conhecimentos-administrativos","path":"04_Assistente_Administrativo/Assistente Administrativo 05 - Arquivística e Gestão Documental.html","sourceSha256":"8726c94fd62e5419ceb5d808dc800b5a48014d56c395ee1502a5c462ddcc6404","sections":[{"title":"1. Documento e arquivo","paragraphs":["Documento registra informação produzida ou recebida no exercício de atividades. Arquivo, em sentido arquivístico, é o conjunto de documentos acumulados organicamente por pessoa ou instituição em função de suas atividades, além de poder designar local/serviço conforme contexto."],"bullets":[]},{"title":"3. Classificação e ordenação","paragraphs":["Classificação organiza documentos por funções, assuntos ou plano adotado. Ordenação coloca unidades em sequência dentro da classe: alfabética, numérica, cronológica etc. Classificar e ordenar são operações relacionadas, mas não idênticas."],"bullets":[]},{"title":"4. Temporalidade","paragraphs":["Tabela de temporalidade define prazos de guarda e destinação com base em valores administrativos, legais, fiscais e históricos. Não se elimina documento apenas porque “parece antigo”."],"bullets":[]}]},{"id":"A06","title":"Atendimento ao Público e Comunicação","disciplineId":"conhecimentos-administrativos","path":"04_Assistente_Administrativo/Assistente Administrativo 06 - Atendimento ao Público e Comunicação.html","sourceSha256":"22b5761fcd9db206694468f571c2d08d5e67af5e1b79e1c35edf9b4ef3d0ec5a","sections":[{"title":"1. Atendimento é processo","paragraphs":["Atender bem não significa apenas ser cordial. Envolve compreender a demanda, confirmar entendimento, fornecer informação correta, registrar quando necessário e encaminhar ao setor competente. Qualidade combina precisão, respeito e resolutividade."],"bullets":[]},{"title":"2. Comunicação interpessoal","paragraphs":["Escuta ativa exige atenção, perguntas de esclarecimento e confirmação. Linguagem deve ser compreensível ao público, evitando jargão desnecessário. Tom profissional não significa frieza."],"bullets":[]},{"title":"3. Recepção e triagem","paragraphs":["Triagem identifica natureza, urgência, documentos necessários e destino. O atendente não deve inventar resposta fora de sua competência; é melhor confirmar fonte ou encaminhar de forma responsável."],"bullets":[]}]},{"id":"A07","title":"Ética e Sigilo Profissional","disciplineId":"conhecimentos-administrativos","path":"04_Assistente_Administrativo/Assistente Administrativo 07 - Ética e Sigilo Profissional.html","sourceSha256":"51f96d2db1a0d343f3b4a8255bf66d74c8e9daa45b4a9811e9f0e37b69c0c71c","sections":[{"title":"1. Ética profissional","paragraphs":["Ética no trabalho administrativo envolve honestidade, responsabilidade, respeito, imparcialidade, zelo e uso adequado de recursos e informações. O servidor deve evitar conflitos de interesse e utilização do cargo para vantagens pessoais."],"bullets":[]},{"title":"2. Sigilo não é segredo arbitrário","paragraphs":["Sigilo profissional significa proteger informações cujo acesso é restrito por natureza ou regra aplicável. Não cabe ao servidor classificar tudo como “secreto” por conveniência, nem divulgar dados só por curiosidade de terceiros."],"bullets":[]},{"title":"3. Necessidade de acesso","paragraphs":["Uma boa regra prática é “acesso conforme necessidade funcional”: mesmo dentro da instituição, nem toda pessoa precisa acessar todo documento. Compartilhamento deve ter finalidade de trabalho e canal apropriado."],"bullets":[]}]},{"id":"A08","title":"Orçamento, Cálculos e Prestação de Contas","disciplineId":"conhecimentos-administrativos","path":"04_Assistente_Administrativo/Assistente Administrativo 08 - Orçamento, Cálculos e Prestação de Contas.html","sourceSha256":"7809b7566f493fcfba7a711e7b0ba1d900b4508f7dfdfb36679cc17aac4a0cff","sections":[{"title":"1. Levantamento de dados","paragraphs":["Antes de prever gastos, identifique quantidades, preços, periodicidade e histórico. Um cálculo simples pode ser “quantidade × custo unitário × número de períodos”. A qualidade da previsão depende da qualidade dos dados."],"bullets":[]},{"title":"2. Previsão de materiais","paragraphs":["Consumo médio ajuda a estimar necessidade, mas deve ser ajustado por eventos sazonais, mudança de demanda, estoque existente e tempo de reposição. Previsão não é certeza: é estimativa fundamentada."],"bullets":[]},{"title":"3. Gastos com pessoal","paragraphs":["Em questões básicas, podem aparecer multiplicações de quantidade de pessoas, valores e períodos. Na prática, gastos de pessoal têm componentes legais adicionais; o edital pede noções e cálculos básicos, portanto foque na estrutura do cálculo apresentado."],"bullets":[]}]},{"id":"S01","title":"LDB - Lei 9.394-1996","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 01 - LDB - Lei 9.394-1996.html","sourceSha256":"9e4032751d6b087e8be201150f5675946811157eae88613fc06f834db8913775","sections":[{"title":"1. Como estudar a LDB para a prova","paragraphs":["A Lei nº 9.394/1996 estabelece as diretrizes e bases da educação nacional. Para Secretário de Escola, não basta decorar números de artigos: é preciso entender como a lei organiza a educação, distribui responsabilidades e estabelece regras que aparecem diretamente na rotina escolar.","A prova pode trocar sujeitos, idades, competências ou transformar uma faculdade em obrigação. Por isso, preste atenção a expressões como deverá, poderá, preferencialmente, obrigatória e gratuita."],"bullets":[]},{"title":"2. Educação, princípios e dever de educar","paragraphs":["A LDB define a educação como fenômeno amplo e disciplina especificamente a educação escolar. A educação escolar deve se vincular ao mundo do trabalho e à prática social.","Entre os princípios do ensino estão igualdade de condições de acesso e permanência, liberdade de aprender e ensinar, pluralismo de ideias e concepções pedagógicas, respeito à liberdade e apreço à tolerância, gratuidade do ensino público em estabelecimentos oficiais, valorização dos profissionais da educação, gestão democrática do ensino público, garantia de padrão de qualidade e aprendizagem ao longo da vida."],"bullets":[]},{"title":"3. Organização dos sistemas e responsabilidades","paragraphs":["União, Estados, Distrito Federal e Municípios organizam seus sistemas de ensino em regime de colaboração. A União exerce coordenação da política nacional, além de funções normativa, redistributiva e supletiva.","Os Municípios atuam prioritariamente na educação infantil e no ensino fundamental. As escolas, por sua vez, possuem incumbências próprias, como elaborar e executar sua proposta pedagógica, administrar pessoal e recursos materiais e financeiros, assegurar cumprimento dos dias letivos e horas-aula e articular-se com famílias e comunidade."],"bullets":[]}]},{"id":"S02","title":"Escrituração Escolar","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 02 - Escrituração Escolar.html","sourceSha256":"00299c50a6084592be82c199e9515874396fca4b615e179b9ca2c68eff25266e","sections":[{"title":"1. O que é escrituração escolar","paragraphs":["Escrituração escolar é o conjunto de registros formais que documenta fatos relativos à vida escolar dos alunos e ao funcionamento da unidade. Ela produz evidência administrativa e jurídica do que ocorreu: matrícula, frequência, resultados, transferências, progressão, conclusão e demais atos escolares.","Não se trata apenas de “preencher papel”. A escrituração deve permitir que outra pessoa, posteriormente, compreenda o histórico do aluno e verifique a regularidade dos atos praticados."],"bullets":[]},{"title":"2. Princípios práticos dos registros","paragraphs":["Esses princípios valem para registros físicos e eletrônicos. Digitalizar não elimina responsabilidade: muda o suporte, mas não a necessidade de confiabilidade."],"bullets":[]},{"title":"3. Fontes e conferência","paragraphs":["Antes de registrar, o secretário deve conferir documentos e dados: nomes, datas, identificação, escola de origem, série/ano, resultados, carga horária e demais informações exigidas. Divergências devem ser tratadas pelos procedimentos oficiais, não corrigidas informalmente por conveniência.","A regra de ouro é: registro deve ser sustentado por fonte verificável. Quando houver retificação, deve existir forma de demonstrar o que foi corrigido e por quê."],"bullets":[]}]},{"id":"S03","title":"Registros Individuais, Ficha e Histórico Escolar","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 03 - Registros Individuais, Ficha e Histórico Escolar.html","sourceSha256":"d43af9733f31967e061362df852ed830458df2711b028838ebb43ab485da19a9","sections":[{"title":"1. Registros individuais","paragraphs":["Registros individuais concentram informações relativas a uma pessoa específica. No caso do aluno, acompanham identificação e trajetória escolar; no caso do funcionário, registram dados funcionais conforme normas da rede.","O edital cita expressamente guia de transferência, ficha individual do aluno e do funcionário e histórico escolar. Portanto, a banca pode perguntar finalidade, conteúdo e procedimentos de conferência."],"bullets":[]},{"title":"2. Ficha individual do aluno","paragraphs":["A ficha individual reúne informações escolares de determinado período ou trajetória, conforme modelo adotado: identificação, matrícula, componente curricular, resultados, frequência e outras ocorrências pertinentes.","Ela deve manter coerência com atas, sistemas e documentos que alimentam o histórico escolar."],"bullets":[]},{"title":"3. Histórico escolar","paragraphs":["O histórico escolar sintetiza a trajetória acadêmica oficial do aluno e pode ser utilizado para comprovar estudos realizados. Erros nele podem dificultar matrícula, transferência ou continuidade dos estudos.","Antes da emissão, confira identificação civil, escola, etapas/anos/séries, componentes, resultados, carga horária e observações exigidas pelas normas do sistema."],"bullets":[]}]},{"id":"S04","title":"Matrícula, Frequência e Transferência","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 04 - Matrícula, Frequência e Transferência.html","sourceSha256":"78915eb8bcfced4a78179199c600d0b6259a37ad3b7ab272dafd9c979e2701a5","sections":[{"title":"1. Matrícula","paragraphs":["A matrícula formaliza o vínculo do estudante com a unidade escolar. O procedimento envolve identificação, documentação exigida, enquadramento na etapa/ano adequado e registro nos sistemas e livros/documentos previstos pela rede.","O servidor não deve criar exigências arbitrárias. Deve seguir legislação e normas da rede, orientar claramente o responsável e registrar pendências de modo adequado."],"bullets":[]},{"title":"2. Frequência","paragraphs":["Frequência não é mera estatística: integra a vida escolar e pode produzir efeitos pedagógicos e legais. A escola deve controlar presença conforme regimento e normas do sistema.","Registros devem ser tempestivos e consistentes. Divergências entre diário, sistema e documentos finais precisam ser tratadas antes do encerramento."],"bullets":[]},{"title":"3. Comunicação e acompanhamento","paragraphs":["A legislação educacional atribui relevância ao acompanhamento da frequência. Conforme a situação e as normas aplicáveis, a escola comunica responsáveis e adota providências institucionais. O secretário atua garantindo registro e fluxo documental adequado."],"bullets":[]}]},{"id":"S05","title":"Protocolo e Arquivo Escolar","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 05 - Protocolo e Arquivo Escolar.html","sourceSha256":"87670d2a650d13e5d2bec30b840a775f07ac33938a45810a75c7c9701f73c6e9","sections":[{"title":"1. Protocolo","paragraphs":["Protocolo é o conjunto de procedimentos usados para receber, registrar, distribuir, controlar tramitação e expedir documentos. Um bom protocolo permite saber o que chegou, quando, de quem, para onde foi encaminhado e qual providência foi tomada.","Número, data, remetente, assunto e destino são exemplos de elementos úteis, conforme sistema adotado."],"bullets":[]},{"title":"2. Arquivo escolar","paragraphs":["O arquivo escolar reúne documentos necessários ao funcionamento da unidade e à comprovação de atos e trajetórias. A organização deve favorecer localização rápida sem comprometer preservação e segurança.","Critérios de classificação podem variar, mas precisam ser consistentes. Guardar “onde couber” gera perda de tempo e risco documental."],"bullets":[]},{"title":"3. Atas de Conselho de Classe e resultados finais","paragraphs":["O edital menciona expressamente atas de Conselho de Classe e atas de resultados finais. Atas registram fatos e deliberações e devem observar o padrão da rede, com clareza, identificação e integridade.","Uma ata final pode servir de fonte para outros documentos. Por isso, inconsistências entre ata, sistema e histórico precisam ser evitadas."],"bullets":[]}]},{"id":"S06","title":"Redação Oficial - Atas, Ofícios e Requerimentos","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 06 - Redação Oficial - Atas, Ofícios e Requerimentos.html","sourceSha256":"a30ee3c32231d1074e3166ad7f259083fdc1a79f44331813baa8869fd57ec078","sections":[{"title":"1. Princípios de redação administrativa","paragraphs":["A comunicação oficial deve ser clara, objetiva, precisa e adequada à situação. O texto precisa permitir compreensão uniforme, sem depender de interpretações subjetivas.","Impessoalidade não significa frieza: significa centrar a comunicação no interesse administrativo e no fato, evitando opiniões pessoais desnecessárias."],"bullets":[]},{"title":"2. Ata","paragraphs":["Ata registra acontecimentos, discussões e deliberações de reunião ou evento colegiado. Deve identificar contexto, participantes conforme regra aplicável, assuntos e decisões de forma fiel e ordenada.","Em prova, atenção à ideia de que ata é registro de fatos ocorridos; não deve ser transformada em texto opinativo do secretário."],"bullets":[]},{"title":"3. Ofício e correspondência oficial","paragraphs":["Ofício é instrumento de comunicação oficial entre órgãos, autoridades ou destinatários no contexto administrativo. Sua estrutura segue padrão institucional e deve apresentar assunto, mensagem e identificação de forma organizada.","Modelos exatos podem variar e ser atualizados. Em questões conceituais, priorize finalidade, clareza, formalidade e identificação adequada."],"bullets":[]}]},{"id":"S07","title":"Constituição Federal - Educação - arts. 205 a 214","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 07 - Constituição Federal - Educação - arts. 205 a 214.html","sourceSha256":"be6be606630bab2016321574235f0fa874c6fa7d660fe04e47c192ea08772399","sections":[{"title":"1. Art. 205 - direito, dever e finalidade da educação","paragraphs":["A Constituição abre a seção da educação estabelecendo três ideias fundamentais: a educação é direito de todos, é dever do Estado e da família e deve ser promovida e incentivada com a colaboração da sociedade.","A finalidade constitucional é o pleno desenvolvimento da pessoa, seu preparo para o exercício da cidadania e sua qualificação para o trabalho. A banca costuma criar alternativas erradas usando palavras como “exclusivamente”, “somente” ou retirando um dos sujeitos responsáveis."],"bullets":[]},{"title":"2. Art. 206 - princípios do ensino","paragraphs":["Entre os princípios estão igualdade de condições para acesso e permanência, liberdade de aprender e ensinar, pluralismo de ideias e concepções pedagógicas, coexistência de instituições públicas e privadas, gratuidade do ensino público em estabelecimentos oficiais, valorização dos profissionais da educação, gestão democrática do ensino público, garantia de padrão de qualidade, piso salarial profissional nacional e direito à educação e à aprendizagem ao longo da vida."],"bullets":[]},{"title":"3. Arts. 208 a 211 - dever do Estado e organização federativa","paragraphs":["O art. 208 assegura, entre outros pontos, educação básica obrigatória e gratuita dos 4 aos 17 anos, oferta gratuita também para quem não teve acesso na idade própria, atendimento educacional especializado preferencialmente na rede regular, educação infantil em creche e pré-escola até 5 anos, ensino noturno regular adequado e programas suplementares em todas as etapas da educação básica.","O acesso ao ensino obrigatório e gratuito é direito público subjetivo. O art. 211 estabelece regime de colaboração: Municípios atuam prioritariamente no ensino fundamental e na educação infantil; Estados e Distrito Federal, prioritariamente no ensino fundamental e médio."],"bullets":[]}]},{"id":"S08","title":"ECA - arts. 1 a 6 e 53 a 69","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 08 - ECA - arts. 1 a 6 e 53 a 69.html","sourceSha256":"361cb4f054dc24e846739482928aafd06bb14e44411ef22d33afa4802b80d6ec","sections":[{"title":"1. Arts. 1º a 6º - proteção integral","paragraphs":["O ECA adota a doutrina da proteção integral. Criança, para efeitos do Estatuto, é a pessoa até 12 anos incompletos; adolescente é aquela entre 12 e 18 anos. Em casos expressos em lei, o Estatuto pode aplicar-se excepcionalmente às pessoas entre 18 e 21 anos.","Crianças e adolescentes são titulares de direitos fundamentais e devem receber oportunidades e facilidades para desenvolvimento físico, mental, moral, espiritual e social em condições de liberdade e dignidade."],"bullets":[]},{"title":"2. Prioridade absoluta e proteção contra violações","paragraphs":["O art. 4º atribui à família, comunidade, sociedade em geral e poder público o dever de assegurar direitos com absoluta prioridade. O texto vigente recebeu alterações recentes, por isso é importante usar fonte atualizada.","O art. 5º veda negligência, discriminação, exploração, violência, crueldade e opressão, responsabilizando atentados aos direitos fundamentais."],"bullets":[]},{"title":"3. Arts. 53 a 59 - direito à educação","paragraphs":["O art. 53 assegura igualdade de condições para acesso e permanência, respeito pelos educadores, possibilidade de contestar critérios avaliativos com recurso às instâncias escolares superiores, organização e participação em entidades estudantis e acesso à escola pública e gratuita próxima da residência, além de regra de vagas para irmãos na mesma etapa ou ciclo.","Pais ou responsáveis têm direito de ter ciência do processo pedagógico e participar da definição das propostas educacionais. O art. 54 trata do dever do Estado; o art. 55, da obrigação de matrícula pelos pais ou responsável."],"bullets":[]}]},{"id":"S09","title":"Atendimento ao Público e Comunicação Escolar","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 09 - Atendimento ao Público e Comunicação Escolar.html","sourceSha256":"1f6b62b89732f34e43f9ebe32273f54d77cefebe49f0739544330d49e78a644d","sections":[{"title":"1. Qualidade no atendimento","paragraphs":["Atendimento de qualidade combina cortesia, precisão, agilidade possível e respeito às normas. Ser cordial não significa prometer o que não pode ser cumprido; ser eficiente não significa pular controles.","O objetivo é compreender a demanda, fornecer informação correta ou encaminhar ao responsável competente e deixar registro quando necessário."],"bullets":[]},{"title":"2. Escuta ativa e clareza","paragraphs":["Escuta ativa exige atenção à fala do usuário, confirmação do que foi entendido e perguntas objetivas quando a solicitação estiver ambígua. Evite interromper, ironizar ou usar jargão interno sem explicação.","Uma técnica simples é repetir a demanda em forma de confirmação: “Então, a senhora precisa da segunda via do histórico para matrícula em outra instituição, correto?”"],"bullets":[]},{"title":"3. Atendimento telefônico","paragraphs":["Ao telefone, identifique a unidade e, conforme padrão institucional, o atendente. Registre nome, contato, assunto e destinatário do recado quando necessário.","Não revele dados pessoais apenas porque a pessoa diz ser parente. Confirme identidade e legitimidade conforme regras da escola antes de fornecer informação protegida."],"bullets":[]}]},{"id":"S10","title":"Relações Humanas, Ética, Sigilo e Assiduidade","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 10 - Relações Humanas, Ética, Sigilo e Assiduidade.html","sourceSha256":"688abdc6493c19d706c8c990f5f2a2451ce62e780f7b3e7b253e6dda2406edd5","sections":[{"title":"1. Relações humanas no trabalho","paragraphs":["A secretaria escolar interage com direção, professores, alunos, famílias, servidores e órgãos externos. Relações profissionais saudáveis dependem de respeito, cooperação, comunicação clara e cumprimento de responsabilidades.","Divergência de opinião é normal. O problema surge quando o conflito deixa o campo profissional e vira desrespeito, boato, retaliação ou obstrução do trabalho."],"bullets":[]},{"title":"2. Ética profissional","paragraphs":["Conduta ética envolve atuar conforme normas, interesse público, respeito aos usuários e responsabilidade pelos próprios atos. Favorecimento pessoal, manipulação de registros, omissão deliberada e uso indevido de informação são incompatíveis com essa postura.","O servidor deve reconhecer limites de competência: não decide o que cabe à direção ou autoridade superior apenas para “resolver mais rápido”."],"bullets":[]},{"title":"3. Sigilo e discrição","paragraphs":["A secretaria lida com dados escolares, pessoais e funcionais. Sigilo significa impedir divulgação indevida, mas não impedir acesso legítimo de quem precisa da informação para exercer atribuição ou direito.","Conversar sobre situação de aluno em corredor, grupo informal ou rede social pode expor informação desnecessariamente."],"bullets":[]}]},{"id":"S11","title":"Censo Escolar e Informações Educacionais","disciplineId":"conhecimentos-escolares","path":"05_Secretario_Escola/Secretário de Escola 11 - Censo Escolar e Informações Educacionais.html","sourceSha256":"d2fd9651c043de46405bbe3d896e03e0579a21ef5cf238a1b8298b06be18c832","sections":[{"title":"1. O que é o Censo Escolar","paragraphs":["O Censo Escolar é o principal levantamento estatístico da educação básica brasileira. É realizado anualmente, coordenado pelo Inep em regime de colaboração com as secretarias estaduais, distrital e municipais e com participação das escolas públicas e privadas. Tem caráter declaratório e é organizado em duas etapas: a primeira reúne dados da matrícula inicial (estabelecimentos, gestores, turmas, estudantes e profissionais escolares em sala); a segunda registra movimento e rendimento ao final do ano letivo.","A declaração é obrigatória para as escolas de educação básica e a qualidade do censo depende da qualidade dos registros administrativos e acadêmicos que o alimentam. Diretores e dirigentes respondem pela veracidade das informações declaradas, conforme as regras do processo censitário."],"bullets":[]},{"title":"2. Tipos de informação","paragraphs":["O levantamento envolve informações sobre escolas, matrículas, turmas, etapas/modalidades, profissionais e características relevantes da oferta educacional. Os campos e calendários específicos devem ser conferidos nas orientações oficiais do ciclo correspondente.","O secretário não deve “estimar” dados quando existe registro oficial: deve usar fontes consistentes e conferir divergências."],"bullets":[]},{"title":"3. Relação com escrituração escolar","paragraphs":["Matrícula registrada incorretamente, duplicidade, aluno transferido sem atualização ou turma cadastrada de forma inadequada podem produzir inconsistências. A escrituração escolar confiável reduz problemas no censo.","Antes de declarar dados, a unidade deve promover conferências de consistência conforme os procedimentos da rede e do sistema utilizado."],"bullets":[]}]}]</script>
