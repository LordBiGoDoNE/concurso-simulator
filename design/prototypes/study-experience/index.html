      function compose() {
        return shell(
          `<button class="back-link" data-screen="home">${icon("left")}Voltar ao início</button><header class="page-intro"><p class="eyebrow">Seu treino, do seu jeito</p><h1 tabindex="-1">Monte seu próximo simulado.</h1><p>Escolha o cargo, distribua as questões e comece a praticar.</p></header><div class="compose-layout"><div class="settings-card"><section data-od-id="compose-role" class="setting-block"><div class="step-heading"><span class="step-number">1</span><h2>Qual é o seu objetivo?</h2></div><label class="sr" for="role">Cargo do simulado</label><select id="role" class="role-select">${catalog.roles.map((r) => `<option value="${r.id}" ${role === r.id ? "selected" : ""}>${escapeText(r.title)}</option>`).join("")}</select></section><section data-od-id="compose-disciplines" class="setting-block"><div class="step-heading"><span class="step-number">2</span><h2>O que você quer praticar?</h2></div><p class="step-help">Distribua de 1 a 100 questões. Os assuntos são opcionais.</p>${disciplines
            .map(
              (d, i) =>
                `<div class="discipline-setting"><div class="discipline-setting-top"><label class="discipline-setting-name" for="quantity-${i}">${escapeText(d.title)}</label><div class="quantity-control"><button data-delta="-1" data-index="${i}" aria-label="Diminuir questões de ${escapeText(d.title)}">−</button><input type="number" id="quantity-${i}" min="0" max="100" step="1" value="${quantities[i]}" data-quantity="${i}"><button data-delta="1" data-index="${i}" aria-label="Aumentar questões de ${escapeText(d.title)}">+</button></div></div><details class="topic-picker" data-topic-group="${i}"><summary>Selecionar assuntos <span data-topic-count="${i}">${topicSelections[d.id]?.length ? "(" + topicSelections[d.id].length + ")" : "(todos)"}</span></summary><div class="topic-options">${catalog.topics
                  .filter((t) => t.disciplineId === d.id)
                  .map(
                    (t) =>
                      `<label><input type="checkbox" data-topic="${t.id}" data-parent="${d.id}" ${topicSelections[d.id]?.includes(t.id) ? "checked" : ""}>${escapeText(t.title)}</label>`,
                  )
                  .join("")}</div></details></div>`,
            )
            .join(
              "",
            )}</section><section data-od-id="compose-variations" class="setting-block"><div class="step-heading"><span class="step-number">3</span><h2>Mais variedade na prática</h2></div><label class="variation-label"><input type="checkbox" id="variations" ${variations ? "checked" : ""}>Incluir variações numéricas disponíveis</label><p class="variation-help">Misture questões fixas e variações de regra de três, porcentagem e juros simples. Os valores podem se repetir.</p></section></div><aside class="summary-card" aria-labelledby="summary-title"><div class="summary-head"><p id="summary-title" class="eyebrow">Seu simulado</p><div class="summary-total"><strong id="summary-total" class="mono">20</strong><span>questões</span></div></div><div class="summary-body"><p class="summary-role" id="summary-role"></p><div id="summary-rows"></div><div id="validation" class="validation" role="status"></div><button class="btn" id="start-attempt">Começar simulado ${icon("right")}</button><p class="summary-note">Distribuição livre e um ponto por acerto. Este simulado de estudo não reproduz as regras oficiais do edital.</p><p class="summary-note">Como visitante, sua tentativa é temporária e não será transferida para uma conta.</p></div></aside></div><div class="mobile-startbar"><div><strong id="mobile-total">20 questões</strong><span>Seu simulado de estudo</span></div><button class="btn" id="mobile-start">Começar ${icon("right")}</button></div>`,
        );
      }
      const sampleQuestions = [
        {
          discipline: "Matemática",
          topic: "Porcentagem",
          text: "Uma mochila custa R$ 200,00. Durante uma promoção, a loja oferece 15% de desconto. Qual é o valor do desconto?",
          options: ["R$ 15,00", "R$ 20,00", "R$ 30,00", "R$ 35,00"],
        },
        {
          discipline: "Português",
          topic: "Concordância verbal",
          text: "Qual alternativa completa corretamente a frase “Os documentos solicitados ____ disponíveis para consulta”?",
          options: ["está", "estão", "estamos", "estava"],
        },
        {
          discipline: "Informática",
          topic: "Atalhos de teclado",
          text: "Em um editor de texto no Windows, qual atalho é normalmente usado para copiar o texto selecionado?",
          options: ["Ctrl + C", "Ctrl + V", "Ctrl + Z", "Ctrl + P"],
        },
      ];
      function practice() {
        if (finished)
          return `${prototypeBar()}<div class="exam-layout"><header class="exam-header">${brand()}<button class="btn text" data-screen="home">Voltar ao início</button></header><main id="main-content" class="finished"><span class="finished-icon">${icon("check")}</span><h1 tabindex="-1">Simulado finalizado.</h1><p>Você percorreu o fluxo proposto. A correção detalhada será integrada à aplicação após a aprovação do desenho.</p><button class="btn" data-screen="home">Voltar ao início ${icon("right")}</button><p class="small">Esta é uma demonstração visual. Nenhuma tentativa foi criada no banco.</p></main></div>`;
        const q = sampleQuestions[position % sampleQuestions.length],
          answered = Object.keys(answers).length;
        return `${prototypeBar()}<div class="exam-layout"><header class="exam-header">${brand()}<div class="exam-title"><strong>${escapeText(catalog.roles.find((r) => r.id === role).title)}</strong><span>Seu momento de concentração</span></div><button class="btn text" id="leave-attempt">Sair da realização ${icon("arrow")}</button></header><main id="main-content" class="exam-body"><div class="exam-main"><div class="question-progress"><span>Questão <strong>${position + 1}</strong> de ${total}</span><span class="muted"><strong class="mono">${answered}</strong> de ${total} respondidas</span></div><div class="progress-track" role="progressbar" aria-label="Questões respondidas" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answered}"><i style="width:${(answered / total) * 100}%"></i></div><section data-od-id="practice-question" class="question-card" aria-labelledby="question-heading"><div class="question-meta"><span class="tag">${q.discipline}</span><span class="small">${q.topic}</span></div><h1 class="question-number" id="question-heading" tabindex="-1">Questão ${String(position + 1).padStart(2, "0")}</h1><p class="statement">${q.text}</p><fieldset><legend>Selecione uma alternativa</legend>${q.options.map((text, i) => `<label class="option"><input type="radio" name="answer" value="${i}" ${answers[position] === i ? "checked" : ""}><span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${text}</span><span class="option-check">${icon("check")}</span></label>`).join("")}</fieldset><div class="question-tools"><span class="local-answer">${icon("check")}Escolhas apenas nesta demonstração</span><button class="btn text" id="clear-answer" ${answers[position] === undefined ? "disabled" : ""}>Limpar resposta</button></div></section><nav class="question-navigation" aria-label="Navegação das questões"><button class="btn secondary" id="previous" ${position === 0 ? "disabled" : ""}>${icon("left")}Anterior</button><button class="btn" id="next" ${position === total - 1 ? "disabled" : ""}>Próxima questão ${icon("right")}</button></nav></div><aside class="exam-aside"><div class="question-map"><h2>Seu percurso</h2><p>Navegue pelas questões a qualquer momento.</p><nav class="number-grid" aria-label="Mapa de questões">${Array.from({ length: total }, (_, i) => `<button data-position="${i}" class="${answers[i] !== undefined ? "answered " : ""}${position === i ? "current" : ""}" ${position === i ? 'aria-current="step"' : ""} aria-label="Questão ${i + 1}, ${answers[i] !== undefined ? "respondida" : "não respondida"}">${String(i + 1).padStart(2, "0")}</button>`).join("")}</nav><div class="map-legend"><span><i class="filled"></i>Respondida</span><span><i></i>Não respondida</span></div><button class="btn secondary" id="finish-attempt">Concluir simulado ${icon("check")}</button></div><p class="exam-notice">${icon("shield")}A correção aparece somente após a conclusão. Você pode alterar suas escolhas enquanto responde.</p><p class="exam-notice">Questões demonstrativas, repetidas para explorar a navegação. Seu acervo real continua na aplicação.</p></aside></main></div>`;
      }
      function summary() {
        const count = quantities.reduce((a, b) => a + b, 0),
          valid =
            Number.isInteger(count) &&
            count >= 1 &&
            count <= 100 &&
            quantities.every((n) => Number.isInteger(n) && n >= 0 && n <= 100);
        document.getElementById("summary-total").textContent = Number.isFinite(
          count,
        )
          ? count
          : "—";
        document.getElementById("summary-role").textContent =
          catalog.roles.find((r) => r.id === role).title;
        document.getElementById("summary-rows").innerHTML = disciplines
          .map((d, i) =>
            quantities[i] > 0
              ? `<div class="summary-row"><span>${escapeText(d.title)}</span><b class="mono">${quantities[i]}</b></div>`
              : "",
          )
          .join("");
        document.getElementById("start-attempt").disabled = !valid;
        document.getElementById("mobile-start").disabled = !valid;
        document.getElementById("mobile-total").textContent =
          (Number.isFinite(count) ? count : "—") + " questões";
        document.getElementById("validation").textContent = valid
          ? ""
          : "Informe quantidades inteiras que somem de 1 a 100.";
      }
      function go(next) {
        screen = next;
        finished = false;
        if (next === "practice" && (!Number.isInteger(total) || total < 1))
          total = 20;
        render();
        window.scrollTo({ top: 0 });
        app.querySelector("h1")?.focus({ preventScroll: true });
      }
      function render() {
        app.innerHTML =
          screen === "home"
            ? home()
            : screen === "compose"
              ? compose()
              : practice();
        if (screen === "compose") summary();
        bind();
      }
      function showDialog(kind) {
        modalReturnFocus = document.activeElement;
        const finish = kind === "finish",
          answered = Object.keys(answers).length;
        document.getElementById("dialog-title").textContent = finish
          ? "Concluir este simulado?"
          : "Sair da realização?";
        document.getElementById("dialog-copy").textContent = finish
          ? `Você respondeu ${answered} de ${total} questões. Depois de concluir, suas respostas não poderão ser alteradas.`
          : "A tentativa de visitante é temporária e não será transferida para uma conta. Deseja voltar ao início?";
        document.getElementById("dialog-confirm").textContent = finish
          ? "Concluir simulado"
          : "Voltar ao início";
        document.getElementById("dialog-confirm").onclick = () => {
          document.getElementById("confirm-dialog").close();
          if (finish) {
            finished = true;
            render();
            app.querySelector("h1")?.focus();
            window.scrollTo({ top: 0 });
          } else go("home");
        };
        document.getElementById("confirm-dialog").showModal();
        document.getElementById("dialog-cancel").focus();
      }
      function bind() {
        app
          .querySelectorAll("[data-screen]")
          .forEach((b) => (b.onclick = () => go(b.dataset.screen)));
        app.querySelectorAll("[data-discipline]").forEach(
          (b) =>
            (b.onclick = () => {
              quantities = disciplines.map((_, i) =>
                i === Number(b.dataset.discipline) ? 10 : 0,
              );
              go("compose");
            }),
        );
        if (screen === "compose") {
          document.getElementById("role").onchange = (e) => {
            role = e.target.value;
            summary();
          };
          app.querySelectorAll("[data-delta]").forEach(
            (b) =>
              (b.onclick = () => {
                const i = Number(b.dataset.index),
                  current = Number.isFinite(quantities[i]) ? quantities[i] : 0;
                quantities[i] = Math.max(
                  0,
                  Math.min(100, current + Number(b.dataset.delta)),
                );
                document.getElementById("quantity-" + i).value = quantities[i];
                summary();
              }),
          );
          app.querySelectorAll("[data-quantity]").forEach(
            (input) =>
              (input.oninput = () => {
                quantities[Number(input.dataset.quantity)] =
                  input.value === "" ? 0 : Number(input.value);
                summary();
              }),
          );
          app.querySelectorAll("[data-topic]").forEach(
            (input) =>
              (input.onchange = () => {
                const parent = input.dataset.parent,
                  set = new Set(topicSelections[parent] || []);
                input.checked
                  ? set.add(input.dataset.topic)
                  : set.delete(input.dataset.topic);
                topicSelections[parent] = [...set];
                const i = disciplines.findIndex((d) => d.id === parent);
                document.querySelector(
                  '[data-topic-count="' + i + '"]',
                ).textContent = set.size ? "(" + set.size + ")" : "(todos)";
              }),
          );
          document.getElementById("variations").onchange = (e) =>
            (variations = e.target.checked);
          document.getElementById("start-attempt").onclick = () => {
            total = quantities.reduce((a, b) => a + b, 0);
            answers = {};
            position = 0;
            go("practice");
          };
          document.getElementById("mobile-start").onclick = () =>
            document.getElementById("start-attempt").click();
        }
        if (screen === "practice" && !finished) {
          app.querySelectorAll('input[name="answer"]').forEach(
            (input) =>
              (input.onchange = () => {
                answers[position] = Number(input.value);
                render();
                const selected = app.querySelector(
                  'input[name="answer"][value="' + answers[position] + '"]',
                );
                selected?.focus({ preventScroll: true });
                document.getElementById("announcement").textContent =
                  "Alternativa selecionada nesta demonstração.";
              }),
          );
          app.querySelectorAll("[data-position]").forEach(
            (b) =>
              (b.onclick = () => {
                position = Number(b.dataset.position);
                render();
                document
                  .getElementById("question-heading")
                  .focus({ preventScroll: true });
              }),
          );
          document.getElementById("previous").onclick = () => {
            position--;
            render();
            document
              .getElementById("question-heading")
              .focus({ preventScroll: true });
          };
          document.getElementById("next").onclick = () => {
            position++;
            render();
            document
              .getElementById("question-heading")
              .focus({ preventScroll: true });
          };
          document.getElementById("clear-answer").onclick = () => {
            delete answers[position];
            render();
            app
              .querySelector('input[name="answer"]')
              ?.focus({ preventScroll: true });
          };
          document.getElementById("finish-attempt").onclick = () =>
            showDialog("finish");
          document.getElementById("leave-attempt").onclick = () =>
            showDialog("leave");
        }
      }
      document.getElementById("dialog-cancel").onclick = () =>
        document.getElementById("confirm-dialog").close();
      document
        .getElementById("confirm-dialog")
        .addEventListener("close", () => {
          if (modalReturnFocus?.isConnected) modalReturnFocus.focus();
        });
      if (screen === "practice") {
        total = 20;
        position = 3;
        answers = { 0: 1, 1: 1, 2: 0 };
      }
      render();
    </script>
  </body>
</html>
