name: concurso-simulator
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: concurso_simulator
      POSTGRES_USER: concurso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concurso -d concurso_simulator"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
