server {
    listen 8080;
    server_name 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    # Upstream errors can include callback query strings. Diagnose via status/health.
    error_log /dev/null;
    if ($host != 127.0.0.1) { return 421; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api|oauth2|login)(/|$) {
        set $backend http://api:8080;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
        proxy_intercept_errors off;
        error_page 502 504 = @api_unavailable;
        add_header Cache-Control no-store always;
    }
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":"unavailable"}';
    }
    location /material/ { try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ =404; }
}
