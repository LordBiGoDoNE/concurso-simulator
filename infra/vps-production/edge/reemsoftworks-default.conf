# nginx do host — porta 80 para Host desconhecido: fecha a conexão sem resposta.
# Instalado na abertura (fase `open`), quando o vhost antigo do concurso pelo IP deixa
# de ser o default_server da porta 80.
#
# Porta 443: não há default_server com ssl_reject_handshake. O vhost `central`
# (serviço administrativo existente, acessado pelo IP e sem SNI) é o padrão da 443 e
# rejeitar handshakes sem SNI o derrubaria. Hosts desconhecidos não chegam à aplicação:
# o vhost do concurso só atende o nome canônico e o nginx interno responde 421.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    # Mantém a renovação HTTP-01 do certificado de IP do `central`, antes servida pelo vhost antigo.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/central-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 444;
    }
}
