# nginx do host — porta 80 dos domínios reemsoftworks. Instalar em
# /etc/nginx/sites-available/ e habilitar. Pode existir antes dos certificados.
# O vhost antigo do concurso pelo IP (concurso-public.conf) continua até o corte.
server {
    listen 80;
    listen [::]:80;
    server_name concurso-simulator.reemsoftworks.com concurso-simulator.reemsoftworks.com.br
                reemsoftworks.com www.reemsoftworks.com reemsoftworks.com.br www.reemsoftworks.com.br;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/central-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
