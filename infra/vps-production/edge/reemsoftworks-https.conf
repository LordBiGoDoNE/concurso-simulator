# nginx do host — HTTPS dos domínios reemsoftworks. Instalar somente depois do
# certificado /etc/letsencrypt/live/reemsoftworks/ existir. Sem http2: o vhost central compartilha a porta 443 sem ele.

# Registro sem query string (o callback OAuth leva code/state na query) e sem cookies.
log_format reemsoftworks_path '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent $request_time "$host"';

# Atrás de dois proxies a API só enxerga o container web; o orçamento de login por origem
# é aplicado aqui, pelo IP real do cliente (revisão final M1).
limit_req_zone $binary_remote_addr zone=concurso_admin_login:10m rate=10r/m;

map $host $reemsoftworks_com_host {
    ~^(?<prefix>.*)reemsoftworks\.com\.br$ ${prefix}reemsoftworks.com;
    default concurso-simulator.reemsoftworks.com;
}

# Aplicação: concurso-simulator.reemsoftworks.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name concurso-simulator.reemsoftworks.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/reemsoftworks/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reemsoftworks/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:reemsoftworks:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/concurso-simulator.access.log reemsoftworks_path;
    error_log /var/log/nginx/concurso-simulator.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Restrição de pré-lançamento (allowlist do IP do usuário) ou vazio após a abertura.
    # Mantido fora do repositório porque contém o IP do usuário.
    include /etc/nginx/snippets/concurso-simulator-access.conf;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host concurso-simulator.reemsoftworks.com;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    # Área administrativa: somente IPs da allowlist administrativa (fora do Git), mesmo após a abertura.
    location ^~ /api/v1/admin/ {
        include /etc/nginx/snippets/concurso-simulator-admin-access.conf;
        proxy_pass http://127.0.0.1:18090;
    }
    location = /api/v1/admin/auth/login {
        include /etc/nginx/snippets/concurso-simulator-admin-access.conf;
        limit_req zone=concurso_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18090;
    }
    location / {
        proxy_pass http://127.0.0.1:18090;
    }
}

# .com.br: 301 para o mesmo host e caminho em .com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reemsoftworks.com.br www.reemsoftworks.com.br concurso-simulator.reemsoftworks.com.br;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/reemsoftworks/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reemsoftworks/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://$reemsoftworks_com_host$request_uri;
}

# Raiz e www de .com: 302 temporário para o concurso até existir outro site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reemsoftworks.com www.reemsoftworks.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/reemsoftworks/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reemsoftworks/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 302 https://concurso-simulator.reemsoftworks.com/;
}
