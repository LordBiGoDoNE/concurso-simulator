schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Projeto: concurso-simulator, material de estudo para concurso público.
  Estado atual: aplicação Java/PostgreSQL/React entregue na main pelo PR #133,
  com execução local Docker e layout integrado pelo #147. O site estático anterior
  permanece em stable/GitHub Pages; novas questões dependem da política editorial.
  Preserve aulas, links relativos, fórmulas acessíveis e funcionamento offline
  do material estático durante a migração. Não mova os arquivos-base agora.
  Evolução acordada: backend Java/Spring Boot, PostgreSQL, migrações Flyway,
  Versões escolhidas pelo usuário: Java 25 LTS e PostgreSQL 18.
  Build do backend: Gradle Wrapper 9.8.0 com Kotlin DSL, não Maven.
  monólito modular, API REST/OpenAPI, frontend React/TypeScript/Vite proposto.
  Trabalhe por mudanças pequenas, branches e PRs; nunca faça merge sem aprovação.
  Padrão obrigatório: epic/<change-name> integra a spec; task/<change-name>/<assunto>
  implementa uma tarefa ou grupo coeso com testes e PR destinado à épica.
  Dependências aguardam integração ou ficam em PR de rascunho explicitamente bloqueado.
  Issue da spec reúne checklist e PRs; revisão final da épica para main é integrada.
  A reformulação foi entregue pelo #133; epic/application-reformulation é histórica.
  Novas specs partem de main atualizada, integram tarefas em epic/<change-name>
  e abrem PR final [SPEC] diretamente para main, com gate cumulativo independente
  e autorização específica de merge. Não reutilizar a épica geral encerrada.
  Roadmap e decisões pendentes: docs/application-reformulation.md.
  CI não publica previews. Preview estático é workflow_dispatch manual com branch
  informada como input e workflow executado a partir de stable. main não publica
  a stack no Pages. Consulte AGENTS.md para limites da automação e do gate.
  Questões parametrizadas e correções precisam ser calculadas no backend,
  com versão, parâmetros e ordem de alternativas preservados por tentativa.
  Não exponha gabaritos durante simulados nem atribua questões autorais às
  instituições usadas apenas como referências de estudo.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
