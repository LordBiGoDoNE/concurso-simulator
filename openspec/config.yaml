schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Projeto: concurso-simulator, material de estudo para concurso público.
  Estado atual: aplicação Java/PostgreSQL/React na main (entregue pelo #133),
  em produção na VPS desde 2026-11-13 (vps-staging-delivery, #224) e também
  executável localmente com Docker. Specs vigentes em openspec/specs/. O site
  estático anterior permanece em stable/GitHub Pages; novas questões dependem
  da política editorial.
  Preserve aulas, links relativos, fórmulas acessíveis e funcionamento offline
  do material estático. Os arquivos-base na raiz são lidos pelo backend, pelos
  scripts e pelos Dockerfiles; movê-los exige spec própria.
  Stack: monólito modular Java/Spring Boot, PostgreSQL, migrações Flyway,
  API REST com contrato OpenAPI versionado em backend/openapi.yaml,
  frontend React/TypeScript/Vite.
  Versões escolhidas pelo usuário: Java 25 LTS e PostgreSQL 18.
  Build do backend: Gradle Wrapper 9.8.0 com Kotlin DSL, não Maven.
  Processo (épicas, tarefas, PRs, issue, autorização, revisão, teste local,
  hotfix, deploy): regras globais em ~/.claude/rules e AGENTS.md, nessa precedência.
  Tarefas de cada spec são organizadas em grupos coesos; uma única confirmação
  de início cobre todos os grupos da spec.
  Roadmap e decisões pendentes: docs/application-reformulation.md.
  Site estático, Pages e previews: seção própria do AGENTS.md.
  Questões parametrizadas e correções precisam ser calculadas no backend,
  com versão, parâmetros e ordem de alternativas preservados por tentativa.
  Não exponha gabaritos durante simulados nem atribua questões autorais às
  instituições usadas apenas como referências de estudo.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
