<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="title desc"><title id="title">Triângulo retângulo: lados e área</title><desc id="desc">Catetos: 3 cm e 4 cm; Hipotenusa: √(3² + 4²) = 5 cm; Área: (3 × 4) ÷ 2 = 6 cm²</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7da39a" stroke-width="1.5"/></marker></defs><rect width="980" height="480" fill="#f5f8f2"/><g font-family="Segoe UI, Arial, sans-serif"><text x="38" y="43" fill="#176e6a" font-size="14" font-weight="700" text-anchor="start"><tspan x="38" dy="0">GABY  /  LIMEIRA 2026</tspan></text><text x="38" y="87" fill="#234951" font-size="29" font-weight="700" text-anchor="start"><tspan x="38" dy="0">Triângulo retângulo: lados e área</tspan></text><polygon points="110,390 110,165 410,390" fill="#d9eee4" stroke="#1e766b" stroke-width="4"/><path d="M110 366 L134 366 L134 390" fill="none" stroke="#1e766b" stroke-width="3"/><text x="72" y="290" fill="#234951" font-size="29" font-weight="700" text-anchor="start"><tspan x="72" dy="0">3</tspan></text><text x="250" y="428" fill="#234951" font-size="29" font-weight="700" text-anchor="start"><tspan x="250" dy="0">4</tspan></text><text x="280" y="260" fill="#234951" font-size="29" font-weight="700" text-anchor="start"><tspan x="280" dy="0">5</tspan></text><text x="525" y="195" fill="#234951" font-size="31" font-weight="700" text-anchor="start"><tspan x="525" dy="0">3² + 4² = 5²</tspan></text><text x="525" y="250" fill="#234951" font-size="26" font-weight="400" text-anchor="start"><tspan x="525" dy="0">9 + 16 = 25</tspan></text><text x="525" y="318" fill="#234951" font-size="25" font-weight="700" text-anchor="start"><tspan x="525" dy="0">Área = (3 × 4) ÷ 2</tspan></text><text x="525" y="359" fill="#234951" font-size="25" font-weight="400" text-anchor="start"><tspan x="525" dy="0">Área = 6 cm²</tspan></text><text x="525" y="426" fill="#234951" font-siz