<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Faixas etárias no ECA</title><desc id="desc">Antes de 12 anos: Criança: até 12 anos incompletos.; Dos 12 aos 18: Adolescente, segundo o art. 2º.; Exceção legal: Aplicação entre 18 e 21 em casos expressos.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7da39a" stroke-width="1.5"/></marker></defs><rect width="980" height="500" fill="#f5f8f2"/><g font-family="Segoe UI, Arial, sans-serif"><text x="38" y="43" fill="#176e6a" font-size="14" font-weight="700" text-anchor="start"><tspan x="38" dy="0">GABY  /  LIMEIRA 2026</tspan></text><text x="38" y="87" fill="#234951" font-size="29" font-weight="700" text-anchor="start"><tspan x="38" dy="0">Faixas etárias no ECA</tspan></text><line x1="85" y1="238" x2="885" y2="238" stroke="#7da39a" stroke-width="3" marker-end="url(#arrow)"/><line x1="85" y1="223" x2="85" y2="254" stroke="#7da39a" stroke-width="3"/><text x="85" y="287" fill="#234951" font-size="24" font-weight="700" text-anchor="middle"><tspan x="85" dy="0">0</tspan></text><line x1="440" y1="223" x2="440" y2="254" stroke="#7da39a" stroke-width="3"/><text x="440" y="287" fill="#234951" font-size="24" font-weight="700" text-anchor="middle"><tspan x="440" dy="0">12</tspan></text><line x1="735" y1="223" x2="735" y2="254" stroke="#7da39a" stroke-width="3"/><text x="735" y="287" fill="#234951" font-size="24" font-weight="700" text-anchor="middle"><tspan x="735" dy="0">18</tspan></text><rect x="85" y="161" width="355" height="59" rx="12" fill="#dcefe6" stroke="#cadbd2"/><rect x="440" y="161" width="295" height="59" rx="12" fill="#e9e1f2" stroke="#cadbd2"/><text x="260" y="200" fill="#234951" font-size="22" font-weight="700" text-anchor="middle"><tspan x="260" dy="0">Criança</tspan></text><text x="588" y="200" fill="#234951" font-size="22" font-weight="700" text-anchor="middle"><tspan x="588" dy="0">Adolescente</tspan></text><text x="85" y="349" fill="#234951" font-size="23" font-weight="400" text-anchor="start"><tspan x="85" dy="0">12 anos incompletos</tspan></text><text x="470" y="349" fill="#234951" font-size="23" font-weight="400" text-anchor="start"><tspan x="470" dy="0">Ao completar 12 anos, muda a</tspan><tspan x="470" dy="29">faixa.</tspan></text><text x="85" y="450" fill="#234951" font-size="21" font-weight="400" text-anchor="start"><tspan x="85" dy="0">Dos 18 aos 21: aplicação excepcional nos casos expressos em lei.</tspan></text><text x="38" y="482" fill="#657c76" font-size="12">ESQUEMA AUTORAL V3 · S08 · REPRESENTAÇÃO DIDÁTICA</text></g></svg>