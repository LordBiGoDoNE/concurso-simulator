<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 505" role="img" aria-labelledby="title desc"><title id="title">Onde o efeito acontece?</title><desc id="desc">Animação: Atua em um objeto do slide.; Transição: Atua na passagem entre slides.; Exemplo: Título aparece; depois o slide muda.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7da39a" stroke-width="1.5"/></marker></defs><rect width="980" height="505" fill="#f5f8f2"/><g font-family="Segoe UI, Arial, sans-serif"><text x="38" y="43" fill="#176e6a" font-size="14" font-weight="700" text-anchor="start"><tspan x="38" dy="0">GABY  /  LIMEIRA 2026</tspan></text><text x="38" y="87" fill="#234951" font-size="29" font-weight="700" text-anchor="start"><tspan x="38" dy="0">Onde o efeito acontece?</tspan></text><rect x="70" y="153" width="350" height="245" rx="12" fill="#fff" stroke="#cadbd2"/><rect x="560" y="153" width="350" height="245" rx="12" fill="#fff" stroke="#cadbd2"/><rect x="105" y="188" width="280" height="48" rx="12" fill="#d7eee3" stroke="#cadbd2"/><text x="120" y="220" fill="#234951" font-size="23" font-weight="700" text-anchor="start"><tspan x="120" dy="0">Título aparece</tspan></text><text x="105" y="287" fill="#234951" font-size="22" font-weight="400" text-anchor="start"><tspan x="105" dy="0">Animação do objeto</tspan></text><text x="595" y="235" fill="#234951" font-size="26" font-weight="700" text-anchor="start"><tspan x="595" dy="0">Slide seguinte</tspan></text><line x1="433" y1="275" x2="545" y2="275" stroke="#7da39a" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="330" fill="#234951" font-size="20" font-weight="400" text-anchor="middle"><tspan x="490" dy="0">Transição</tspan></text><text x="75" y="455" fill="#234951" font-size="23" font-weight="400" text-anchor="start"><tspan x="75" dy="0">Objeto dentro do slide → animação | Entre slides → transição</tspan></text><text x="38" y="487" fill="#657c76" font-size="12">ESQUEMA AUTORAL V3 · I09 · REPRESENTAÇÃO DIDÁTICA</text></g></svg>