<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="title desc"><title id="title">Porcentagem sempre tem uma base</title><desc id="desc">Valor inicial: R$ 200 = 100%; Desconto: 15% de 200 = R$ 30; Valor final: 200 − 30 = R$ 170</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7da39a" stroke-width="1.5"/></marker></defs><rect width="980" height="480" fill="#f5f8f2"/><g font-family="Segoe UI, Arial, sans-serif"><text x="38" y="43" fill="#176e6a" font-size="14" font-weight="700" text-anchor="start"><tspan x="38" dy="0">GABY  /  LIMEIRA 2026</tspan></text><text x="38" y="87" fill="#234951" font-size="29" font-weight="700" text-anchor="start"><tspan x="38" dy="0">Porcentagem sempre tem uma base</tspan></text><rect x="65" y="162" width="840" height="72" rx="12" fill="#e5eee8" stroke="#cadbd2"/><rect x="65" y="162" width="126" height="72" rx="0" fill="#d39b44" stroke="#d39b44"/><rect x="191" y="162" width="714" height="72" rx="0" fill="#287c6f" stroke="#287c6f"/><text x="128" y="207" fill="#183e46" font-size="25" font-weight="700" text-anchor="middle"><tspan x="128" dy="0">15%</tspan></text><text x="548" y="207" fill="#fff" font-size="25" font-weight="700" text-anchor="middle"><tspan x="548" dy="0">85%</tspan></text><text x="65" y="297" fill="#234951" font-size="22" font-weight="700" text-anchor="start"><tspan x="65" dy="0">Valor inicial</tspan></text><text x="65" y="335" fill="#234951" font-size="21" font-weight="400" text-anchor="start"><tspan x="65" dy="0">R$ 200 = 100%</tspan></text><text x="360" y="297" fill="#234951" font-size="22" font-weight="700" text-anchor="start"><tspan x="360" dy="0">Desconto</tspan></text><text x="360" y="335" fill="#234951" font-size="21" font-weight="400" text-anchor="start"><tspan x="360" dy="0">15% de 200 = R$ 30</tspan></text><text x="655" y="297" fill="#234951" font-size="22" font-weight="700" text-anchor="start"><tspan x="655" dy="0">Valor final</tspan></text><text x="655" y="335" fill="#234951" font-size="21" font-weight="400" text-anchor="start"><tspan x="655" dy="0">200 − 30 = R$ 170</tspan></text><text x="65" y="434" fill="#234951" font-size="25" font-weight="700" text-anchor="start"><tspan x="65" dy="0">R$ 200 × 0,15 = R$ 30 de desconto</tspan></text><text x="38" y="462" fill="#657c76" font-size="12">ESQUEMA AUTORAL V3 · M04 · REPRESENTAÇÃO DIDÁTICA</text></g></svg>