<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" role="img" aria-labelledby="title desc"><title id="title">A média ponderada considera os pesos</title><desc id="desc">Notas e pesos: 6 com peso 1; 9 com peso 2.; Produtos: 6 × 1 + 9 × 2 = 24.; Divisão: 24 ÷ (1 + 2) = 8.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7da39a" stroke-width="1.5"/></marker></defs><rect width="980" height="450" fill="#f5f8f2"/><g font-family="Segoe UI, Arial, sans-serif"><text x="38" y="43" fill="#176e6a" font-size="14" font-weight="700" text-anchor="start"><tspan x="38" dy="0">GABY  /  LIMEIRA 2026</tspan></text><text x="38" y="87" fill="#234951" font-size="29" font-weight="700" text-anchor="start"><tspan x="38" dy="0">A média ponderada considera os pesos</tspan></text><rect x="40" y="152" width="286" height="244" rx="12" fill="#fff" stroke="#cadbd2"/><text x="60" y="187" fill="#16796d" font-size="16" font-weight="700" text-anchor="start"><tspan x="60" dy="0">A</tspan></text><text x="60" y="230" fill="#234951" font-size="24" font-weight="700" text-anchor="start"><tspan x="60" dy="0">Notas e pesos</tspan></text><text x="60" y="271" fill="#234951" font-size="22" font-weight="400" text-anchor="start"><tspan x="60" dy="0">6 com peso 1; 9 com</tspan><tspan x="60" dy="28">peso 2.</tspan></text><rect x="350" y="152" width="286" height="244" rx="12" fill="#fff" stroke="#cadbd2"/><text x="370" y="187" fill="#16796d" font-size="16" font-weight="700" text-anchor="start"><tspan x="370" dy="0">B</tspan></text><text x="370" y="230" fill="#234951" font-size="24" font-weight="700" text-anchor="start"><tspan x="370" dy="0">Produtos</tspan></text><text x="370" y="271" fill="#234951" font-size="22" font-weight="400" text-anchor="start"><tspan x="370" dy="0">6 × 1 + 9 × 2 = 24.</tspan></text><rect x="660" y="152" width="286" height="244" rx="12" fill="#fff" stroke="#cadbd2"/><text x="680" y="187" fill=